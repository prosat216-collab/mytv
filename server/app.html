<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ SAT CONNECT</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0c11; font-family: system-ui, sans-serif; color: #fff; overflow: hidden; user-select: none; }
.wrap { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 60px; }
header { display: flex; justify-content: space-between; align-items: center; }
.shop-title { font-size: 3rem; font-weight: 900; color: #ffb21e; text-shadow: 0 4px 15px rgba(255,178,30,0.4); }
.clock { font-size: 2rem; font-weight: bold; color: #f6e7c8; font-family: monospace; }
.center { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.welcome { font-size: 1.6rem; color: #a59f92; margin-bottom: 40px; }
.grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
.app-card {
    background: #161b22;
    border: 3px solid #30363d;
    border-radius: 20px;
    padding: 30px 20px;
    width: 190px;
    cursor: pointer;
    outline: none;
    text-align: center;
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
}
.app-card:focus, .app-card:hover {
    border-color: #ffb21e;
    background: #241c10;
    transform: scale(1.12);
    box-shadow: 0 10px 25px rgba(255,178,30,0.4);
}
.app-icon { font-size: 4rem; margin-bottom: 15px; }
.app-name { font-size: 1.3rem; font-weight: bold; color: #fff; }
footer { text-align: center; color: #6e7681; font-size: 1rem; }
</style>
</head>
<body>

<div class="wrap">
    <header>
        <div class="shop-title" id="shopName">AZ SAT CONNECT</div>
        <div class="clock" id="clock">--:--</div>
    </header>

    <div class="center">
        <div class="welcome" id="welcomeMsg">مرحباً بكم - أحدث الاشتراكات والتطبيقات</div>
        <div class="grid" id="appsContainer">
            <!-- التطبيقات ستظهر هنا تلقائياً -->
        </div>
    </div>

    <footer>استعمل أزرار الأسهم في الريموت واضغط OK للفتح</footer>
</div>

<script>
(function () {
    var N = window.MyTV || null;
    var API_URL = "https://azsatconnect.alwaysdata.net/api/device.php";
    
    // توليد UID فريد للجهاز
    var deviceUid = localStorage.getItem("mytv_uid");
    if (!deviceUid) {
        deviceUid = "tv-" + Math.random().toString(36).substring(2, 10).toUpperCase();
        localStorage.setItem("mytv_uid", deviceUid);
    }

    // ساعة حية
    setInterval(function() {
        var d = new Date();
        document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }, 1000);

    function loadApps() {
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'config', uid: deviceUid, model: 'Android TV' })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.shop) {
                document.getElementById('shopName').textContent = data.shop.name || 'AZ SAT CONNECT';
                document.getElementById('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم';
            }

            var grid = document.getElementById('appsContainer');
            grid.innerHTML = '';

            var apps = data.apps || [];
            if (apps.length === 0) {
                grid.innerHTML = '<p style="color:#888; font-size:1.4rem;">لا توجد تطبيقات مضافة حالياً. أضفها من لوحة التحكم!</p>';
                return;
            }

            for (var i = 0; i < apps.length; i++) {
                (function(app) {
                    var btn = document.createElement('button');
                    btn.className = 'app-card';
                    var iconHtml = app.icon ? '<img src="' + app.icon + '" style="width:70px;height:70px;object-fit:contain;margin-bottom:15px;border-radius:12px;">' : '<div class="app-icon">📺</div>';
                    btn.innerHTML = iconHtml + '<div class="app-name">' + app.name + '</div>';
                    btn.onclick = function() {
                        if (N && app.package) N.launch(app.package);
                    };
                    grid.appendChild(btn);
                })(apps[i]);
            }

            // تركيز الريموت على أول تطبيق
            var first = grid.querySelector('.app-card');
            if (first && document.activeElement !== first) first.focus();
        })
        .catch(function(err) {
            console.log("Error loading apps:", err);
        });
    }

    loadApps();
    setInterval(loadApps, 15000); // تحديث كل 15 ثانية
})();
</script>
</body>
</html>
