<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AZ SAT CONNECT</title>
<style>
:root{
  --ink:#080b11; --panel:rgba(13,20,32,.92); --line:rgba(56,189,248,.35); --line2:#1e293b;
  --text:#f0f9ff; --cream:#e0f2fe; --muted:#94a3b8;
  --blue:#38bdf8; --cyan:#06b6d4; --ok:#34d399;
  --grad:linear-gradient(135deg,#38bdf8,#0284c7);
}
html{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:system-ui,sans-serif;color:var(--text);user-select:none}
img{display:block}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at center, #0f172a 0%, #030712 100%)}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* focus (remote control) باللون الأزرق الفاتح */
.f{outline:none;transition:transform .15s}
.app.f:focus{transform:scale(1.12)}
.app.f:focus .ring{border-color:#7dd3fc;box-shadow:0 0 0 .28rem rgba(56,189,248,.4),0 .8rem 2.2rem -.3rem rgba(56,189,248,.7)}
.app.f:focus .name{color:#38bdf8}

/* home */
#scrHome{padding:1.8rem 3.4rem 1.4rem;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.shop{display:flex;align-items:center;min-width:0}

/* شعار AZ SAT CONNECT المخصص */
.shop .logo-wrap{width:4.8rem;height:4.8rem;border-radius:50%;flex-shrink:0;background:#fff;border:.15rem solid var(--blue);display:flex;align-items:center;justify-content:center;margin-left:1.1rem;box-shadow:0 0 15px rgba(56,189,248,.3);padding:.35rem}
.shop .logo-wrap svg{width:100%;height:100%}
.shop b{display:block;font-size:1.8rem;font-weight:900;line-height:1.2;white-space:nowrap}
.shop small{font-size:.9rem;color:var(--muted)}
.clock{text-align:start;flex-shrink:0}
.clock b{display:block;font-size:2.1rem;font-weight:700;direction:ltr;line-height:1.1;color:var(--blue)}
.clock small{font-size:.9rem;color:var(--muted)}
.topleft{display:flex;align-items:center}

/* weather & prayer */
.wx{display:flex;align-items:center;background:rgba(15,23,42,.65);border:.08rem solid var(--line);border-radius:1.1rem;padding:.45rem 1.1rem;margin:0 1.2rem}
.wx .t{font-size:2rem;font-weight:800;direction:ltr;margin:0 .6rem;line-height:1;color:var(--blue)}
.wx .d{font-size:.85rem;line-height:1.3;color:#cbd5e1}
.wx .d b{display:block;color:#fff;font-size:.95rem}

.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.welcome{font-size:1.5rem;font-weight:700;color:var(--cream);background:rgba(15,23,42,.7);border:.08rem solid var(--line);border-radius:99rem;padding:.45rem 2rem;text-align:center;margin-bottom:1.4rem}
#apps{display:flex;flex-wrap:wrap;justify-content:center;max-width:68rem;max-height:100%;overflow-y:auto;padding:.5rem}
.app{display:flex;flex-direction:column;align-items:center;width:9.2rem;margin:.6rem .6rem}
.ring{width:8.2rem;height:8.2rem;border-radius:50%;padding:.3rem;border:.22rem solid var(--blue);transition:box-shadow .2s,border-color .2s;position:relative;background:#0d1525;display:flex;align-items:center;justify-content:center}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ring .ph{font-size:3rem}
.name{font-size:1.1rem;font-weight:700;color:var(--text);text-align:center;line-height:1.3;margin-top:.8rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bottom{display:flex;justify-content:space-between;align-items:center}
.hint{font-size:.95rem;color:var(--muted)}
.pray{display:flex;align-items:stretch;background:rgba(15,23,42,.7);border:.08rem solid var(--line);border-radius:1.1rem;padding:.3rem;margin:0 auto}
.pray .p{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.3rem .9rem;border-radius:.7rem;min-width:5.2rem}
.pray .p small{font-size:.8rem;color:var(--muted)}
.pray .p b{font-size:1.15rem;font-weight:800;direction:ltr;line-height:1.2;color:#f0f9ff}
.pray .p.next{background:var(--grad);color:#041320}
.pray .p.next small{color:#082f49;font-weight:800}
.pray .p.next b{color:#041320}

.renew{display:flex;align-items:center}
.renew .txt{text-align:end;margin-left:.8rem}
.renew .txt b{display:block;font-size:1rem;color:var(--cream);font-weight:700}
.renew .txt small{display:block;font-size:.95rem;color:var(--blue);direction:ltr;unicode-bidi:embed;font-weight:bold;margin-top:2px}
.qrbox{background:#fff;border-radius:.6rem;padding:.35rem;width:5rem;height:5rem}
.qrbox img{width:100%;height:100%}

/* modal رسائل */
#msgModal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:99}
.msg-box{background:#0f172a;border:.12rem solid var(--blue);border-radius:1.4rem;padding:2rem;max-width:32rem;text-align:center}
.msg-box h2{color:var(--blue);margin-bottom:1rem}
.msg-box p{font-size:1.3rem;color:#f0f9ff;margin-bottom:1.5rem}
.btn{font-size:1.1rem;font-weight:800;padding:.5rem 1.8rem;border-radius:.8rem;background:var(--grad);color:#041320;cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div>

<section id="scrHome" class="screen on">
  <div class="top">
    <div class="shop">
      <!-- شعار AZ SAT CONNECT النظيف والاحترافي -->
      <div class="logo-wrap">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#041320" stroke-width="5"/>
          <ellipse cx="50" cy="50" rx="42" ry="24" stroke="#0284c7" stroke-width="4" transform="rotate(-25 50 50)"/>
          <circle cx="50" cy="50" r="26" stroke="#041320" stroke-width="4"/>
          <circle cx="50" cy="50" r="8" fill="#38bdf8"/>
          <path d="M50 14V34M50 66V86M14 50H34M66 50H86" stroke="#041320" stroke-width="4" stroke-linecap="round"/>
          <path d="M26 26L38 38M62 62L74 74" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <b id="shopName">AZ SAT CONNECT</b>
        <small>الوكيل المعتمد · أحدث أجهزة الاستقبال</small>
      </div>
    </div>
    <div class="topleft">
      <div class="clock"><b id="clockTime">--:--</b><small id="clockDate">--</small></div>
      <div class="wx" id="wx">
        <div style="font-size:2rem">☀️</div>
        <div class="t" id="wxTemp">22°</div>
        <div class="d"><b>تونس العاصمة</b><span style="font-size:.75rem;color:#94a3b8">صحو معتدل</span></div>
      </div>
    </div>
  </div>

  <div class="mid">
    <div class="welcome" id="welcomeMsg">مرحباً بكم عند AZ SAT CONNECT</div>
    <div id="apps"></div>
  </div>

  <div class="bottom">
    <div class="hint">استعمل الأسهم في الريموت واضغط OK للفتح</div>
    <div class="pray" id="pray">
      <div class="p"><small>الفجر</small><b>05:24</b></div>
      <div class="p"><small>الظهر</small><b>12:15</b></div>
      <div class="p next"><small>العصر</small><b>15:08</b></div>
      <div class="p"><small>المغرب</small><b>17:22</b></div>
      <div class="p"><small>العشاء</small><b>18:48</b></div>
    </div>
    <div class="renew">
      <div class="txt">
        <b>للتجديد والاشتراك</b>
        <small>+216 26 117 917</small>
      </div>
      <div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://wa.me/21626117917" alt=""></div>
    </div>
  </div>
</section>

<div id="msgModal">
  <div class="msg-box">
    <h2>✉️ رسالة من المحل</h2>
    <p id="msgBody">نص الرسالة</p>
    <button class="btn f" id="btnMsgOk">موافق</button>
  </div>
</div>

<script>
(function () {
  var N = window.MyTV || null;
  var API_URL = "https://azsatconnect.alwaysdata.net/api/device.php";
  var WX_URL = "https://azsatconnect.alwaysdata.net/api/weather.php";

  var uid = localStorage.getItem("mytv_uid") || ("tv-" + Math.random().toString(36).substr(2, 9));
  localStorage.setItem("mytv_uid", uid);

  // تحديث الساعة والتاريخ
  var days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  var months = ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان', 'جويلية', 'أوت', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  setInterval(function () {
    var d = new Date();
    document.getElementById('clockTime').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    document.getElementById('clockDate').textContent = days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
  }, 1000);

  // جلب الطقس الحي
  function loadWeather() {
    fetch(WX_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lat: 36.80, lon: 10.18 }) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d.ok && d.temp) document.getElementById('wxTemp').textContent = d.temp + '°'; })
      .catch(function(){});
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  // فتح الإعدادات بطريقة متوافقة مع كل أجهزة البوكس
  function openDeviceSettings() {
    if (N && typeof N.openSystem === 'function') {
      N.openSystem('settings');
      return;
    }
    if (N && typeof N.launch === 'function') {
      var pkgs = ['com.android.tv.settings', 'com.android.settings'];
      for (var i = 0; i < pkgs.length; i++) {
        if (N.launch(pkgs[i])) return;
      }
    }
  }

  // جلب التطبيقات والبيانات
  function loadData() {
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'config', uid: uid, model: 'Android TV' })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.shop) {
        document.getElementById('shopName').textContent = data.shop.name || 'AZ SAT CONNECT';
        document.getElementById('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم عند AZ SAT CONNECT';
      }

      var appsBox = document.getElementById('apps');
      appsBox.innerHTML = '';

      // 1. زر الإعدادات المطور
      var setBtn = document.createElement('button');
      setBtn.className = 'app f';
      setBtn.innerHTML = '<div class="ring"><div class="ph">⚙️</div></div><div class="name">الإعدادات</div>';
      setBtn.onclick = openDeviceSettings;
      appsBox.appendChild(setBtn);

      // 2. زر القرآن الكريم
      var qBtn = document.createElement('button');
      qBtn.className = 'app f';
      qBtn.innerHTML = '<div class="ring"><div class="ph">📖</div></div><div class="name">القرآن الكريم</div>';
      qBtn.onclick = function() {
        if (N && typeof N.launch === 'function' && N.launch('com.quran.labs.androidquran')) return;
        if (N && typeof N.openUrl === 'function') N.openUrl("https://quran.com");
      };
      appsBox.appendChild(qBtn);

      // 3. التطبيقات المضافة من اللوحة
      (data.apps || []).forEach(function (app) {
        var btn = document.createElement('button');
        btn.className = 'app f';
        var iconHtml = app.icon ? '<img src="' + app.icon + '" alt="">' : '<div class="ph">📺</div>';
        btn.innerHTML = '<div class="ring">' + iconHtml + '</div><div class="name">' + app.name + '</div>';
        btn.onclick = function () {
          if (N && app.package) N.launch(app.package);
        };
        appsBox.appendChild(btn);
      });

      // الرسائل المنبثقة
      if (data.messages && data.messages.length > 0) {
        var last = data.messages[data.messages.length - 1];
        var seen = localStorage.getItem("seen_msg_" + last.id);
        if (seen !== "1") {
          document.getElementById('msgBody').textContent = last.body;
          document.getElementById('msgModal').style.display = 'flex';
          document.getElementById('btnMsgOk').focus();
          document.getElementById('btnMsgOk').onclick = function() {
            localStorage.setItem("seen_msg_" + last.id, "1");
            document.getElementById('msgModal').style.display = 'none';
            var first = appsBox.querySelector('.app');
            if (first) first.focus();
          };
        }
      }

      // التركيز التلقائي
      if (document.getElementById('msgModal').style.display !== 'flex') {
        var cur = document.activeElement;
        if (!cur || !cur.classList.contains('app')) {
          var first = appsBox.querySelector('.app');
          if (first) first.focus();
        }
      }
    })
    .catch(function () {});
  }

  loadData();
  setInterval(loadData, 10000);
})();
</script>
</body>
</html>
