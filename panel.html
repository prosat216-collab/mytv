<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTV - لوحة تحكم المحل</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0e1117; color: #e6edf3; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1, h2, h3 { color: #ffb21e; text-align: center; margin-top: 0; }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; background: #0d1117; border: 1px solid #30363d; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #ffb21e; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; color: #000; transition: 0.2s; margin-bottom: 10px; }
        button:active { transform: scale(0.98); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: #30363d; text-align: center; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab.active { background: #ffb21e; color: #000; }
        .section { display: none; }
        .section.active { display: block; }
        #statusMsg { text-align: center; font-weight: bold; font-size: 1.1rem; padding: 12px; margin-bottom: 15px; border-radius: 8px; display: none; }
        .msg-error { background: rgba(248,81,73,0.15); border: 1px solid #f85149; color: #f85149; }
        .msg-success { background: rgba(63,185,80,0.15); border: 1px solid #3fb950; color: #3fb950; }
        .msg-info { background: rgba(255,178,30,0.15); border: 1px solid #ffb21e; color: #ffb21e; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة إدارة MyTV 📺</h1>
    
    <div id="statusMsg"></div>

    <!-- تسجيل الدخول -->
    <div id="authSection" class="card">
        <h3>تسجيل الدخول للمحل</h3>
        <p style="text-align: center; font-size: 0.9rem; color: #888;">أدخل رمز GitHub (Token) الذي يبدأ بـ ghp_</p>
        <input type="text" id="gitTokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
        <button id="btnLogin" onclick="login()">دخول</button>
    </div>

    <!-- اللوحة الرئيسية -->
    <div id="mainPanel" style="display:none;">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('tab-devices')">الأجهزة</div>
            <div class="tab" onclick="switchTab('tab-apps')">التطبيقات</div>
            <div class="tab" onclick="switchTab('tab-msgs')">الرسائل</div>
        </div>

        <!-- 1. الأجهزة -->
        <div id="tab-devices" class="section active card">
            <h3>⚡ تفعيل شاشة جديدة</h3>
            <input type="text" id="devCode" placeholder="أدخل كود الشاشة (مثال: A3CD8)" style="text-align:center; font-size:24px; letter-spacing:4px; text-transform:uppercase;">
            <button onclick="activateDevice()">تفعيل التلفاز الآن</button>
        </div>

        <!-- 2. التطبيقات -->
        <div id="tab-apps" class="section card">
            <h3>➕ إضافة تطبيق للشاشات</h3>
            <input type="text" id="appName" placeholder="اسم التطبيق (مثال: Yacine TV)">
            <input type="text" id="appPackage" placeholder="اسم الحزمة (مثال: com.yacine.tv)">
            <button onclick="addApp()">إضافة التطبيق</button>
        </div>

        <!-- 3. الرسائل -->
        <div id="tab-msgs" class="section card">
            <h3>✉️ إرسال رسالة للحرفاء</h3>
            <textarea id="msgBody" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
            <button onclick="sendMessage()">إرسال الرسالة الآن</button>
        </div>

        <button onclick="logout()" style="background:#30363d; color:#fff; margin-top:20px;">تسجيل الخروج (مسح الرمز)</button>
    </div>
</div>

<script>
const OWNER = "prosat216-collab";
const REPO = "mytv";
const PATH = "data.json";

let githubData = null;
let fileSha = "";

function setStatus(text, type) {
    const el = document.getElementById('statusMsg');
    el.className = 'msg-' + type;
    el.innerText = text;
    el.style.display = 'block';
}

function clearStatus() {
    document.getElementById('statusMsg').style.display = 'none';
}

function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
}

function login() {
    clearStatus();
    const token = document.getElementById('gitTokenInput').value.trim();
    if (!token) {
        setStatus("⚠️ الرجاء كتابة أو لصق الرمز السري!", "error");
        return;
    }
    localStorage.setItem("mytv_token", token);
    connect(token);
}

function logout() {
    localStorage.removeItem("mytv_token");
    location.reload();
}

async function connect(token) {
    setStatus("⏳ جاري التحقق من الرمز والاتصال بـ GitHub...", "info");
    document.getElementById('btnLogin').disabled = true;

    try {
        const res = await fetch(https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}, {
            headers: {
                "Authorization": Bearer ${token},
                "Accept": "application/vnd.github.v3+json"
            }
        });

        if (res.status === 401 || res.status === 403) {
            throw new Error("الرمز غير صالح أو منتهي الصلاحية! تأكد من إنشاء Token بصلاحية repo.");
        }

        if (res.status === 404) {
            throw new Error("لم يتم العثور على ملف data.json في المستودع.");
        }

        if (!res.ok) {
            throw new Error(خطأ في الاتصال: كود ${res.status});
        }

        const file = await res.json();
        fileSha = file.sha;
        
        // فك تشفير المحتوى مع دعم اللغة العربية UTF-8
        const binary = atob(file.content.replace(/\s/g, ''));
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        const decoded = new TextDecoder('utf-8').decode(bytes);
        
        githubData = JSON.parse(decoded);
        if (!githubData.apps) githubData.apps = [];
        if (!githubData.messages) githubData.messages = [];
        if (!githubData.devices) githubData.devices = {};

        clearStatus();
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';

    } catch (err) {
        setStatus("❌ " + err.message, "error");
        localStorage.removeItem("mytv_token");
    } finally {
        document.getElementById('btnLogin').disabled = false;
    }
}

async function saveToCloud(actionMessage) {
    const token = localStorage.getItem("mytv_token");
    setStatus("⏳ جاري حفظ البيانات على السحاب...", "info");

    try {
        const jsonString = JSON.stringify(githubData, null, 2);
        const bytes = new TextEncoder().encode(jsonString);
        let binary = '';
        bytes.forEach(b => binary += String.fromCharCode(b));
        const base64Content = btoa(binary);

        const res = await fetch(https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}, {
            method: "PUT",
            headers: {
                "Authorization": Bearer ${token},
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: "Update from Panel: " + actionMessage,
                content: base64Content,
                sha: fileSha
            })
        });

        if (!res.ok) {
            throw new Error(فشل الحفظ: كود ${res.status});
        }

        const data = await res.json();
        fileSha = data.content.sha;
        setStatus("✅ " + actionMessage + " بنجاح!", "success");
        setTimeout(clearStatus, 4000);

    } catch (err) {
        setStatus("❌ " + err.message, "error");
    }
}

function activateDevice() {
    const code = document.getElementById('devCode').value.trim().toUpperCase();
    if (!code) return alert("اكتب كود التلفاز أولاً!");

    githubData.devices[code] = {
        code: code,
        paired: true,
        active: true,
        model: "Android TV",
        expires: "2030-12-31"
    };

    saveToCloud(تفعيل الجهاز (${code}));
    document.getElementById('devCode').value = '';
}

function addApp() {
    const name = document.getElementById('appName').value.trim();
    const pkg = document.getElementById('appPackage').value.trim();
    if (!name || !pkg) return alert("أكمل اسم التطبيق والحزمة!");

    githubData.apps.push({ id: Date.now(), name: name, package: pkg });
    saveToCloud(إضافة تطبيق (${name}));
    document.getElementById('appName').value = '';
    document.getElementById('appPackage').value = '';
}

function sendMessage() {
    const msg = document.getElementById('msgBody').value.trim();
    if (!msg) return alert("اكتب نص الرسالة أولاً!");

    githubData.messages.push({ id: "msg_" + Date.now(), body: msg });
    saveToCloud("إرسال رسالة جديدة");
    document.getElementById('msgBody').value = '';
}

// محاولة الدخول التلقائي إن وُجد Token محفوظ مسبقاً
window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem("mytv_token");
    if (saved) {
        connect(saved);
    }
});
</script>

</body>
</html>
