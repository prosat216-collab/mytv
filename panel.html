<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم MyTV الاحترافية</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0e1117; color: #e6edf3; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h1, h3 { color: #ffb21e; text-align: center; }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; background: #0d1117; border: 1px solid #30363d; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #ffb21e; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; color: #000; margin-bottom: 10px; }
        #loading { text-align: center; color: #ffb21e; font-weight: bold; display: none; margin: 10px; }
        .success { color: #3fb950; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة إدارة MyTV 📺</h1>
    
    <div id="authSection" class="card">
        <h3>تسجيل الدخول للمحل</h3>
        <input type="password" id="gitToken" placeholder="ضع رمز GitHub السري هنا (ghp_...)">
        <button onclick="login()">دخول</button>
    </div>

    <div id="loading">⏳ جاري الاتصال بالسحاب...</div>
    <div id="successMsg" class="success">✅ تم الإرسال بنجاح! التلفاز سيتحدث فوراً.</div>

    <div id="mainPanel" style="display:none;">
        <div class="card">
            <h3>➕ إرسال تطبيق لشاشات الزبائن</h3>
            <input type="text" id="appName" placeholder="اسم التطبيق (مثال: Yacine TV)">
            <input type="text" id="appPackage" placeholder="اسم الحزمة (مثال: com.yacine.tv)">
            <button onclick="addApp()">إضافة التطبيق للشاشات</button>
        </div>

        <div class="card">
            <h3>✉️ إرسال رسالة للحرفاء (تظهر على الشاشة)</h3>
            <textarea id="msgBody" rows="4" placeholder="اكتب رسالتك هنا... (مثال: نذكركم باقتراب موعد التجديد)"></textarea>
            <button onclick="sendMessage()">إرسال الرسالة الآن</button>
        </div>
        
        <button onclick="logout()" style="background:#f85149; color:#fff;">تسجيل الخروج</button>
    </div>
</div>

<script>
const OWNER = "prosat216-collab";
const REPO = "mytv";
const PATH = "data.json";
let githubData = null;
let fileSha = "";

function login() {
    let t = document.getElementById('gitToken').value.trim();
    if (!t) return alert("أدخل الرمز أولاً!");
    localStorage.setItem("mytv_token", t);
    fetchData();
}

function logout() {
    localStorage.removeItem("mytv_token");
    location.reload();
}

async function fetchData() {
    let token = localStorage.getItem("mytv_token");
    if (!token) return;
    
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    
    try {
        let res = await fetch(https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}, { headers: { "Authorization": token ${token} } });
        if (!res.ok) throw new Error("الرمز غير صحيح.");
        let file = await res.json();
        fileSha = file.sha;
        // قراءة البيانات من السحاب
        githubData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
        if (!githubData.apps) githubData.apps = [];
        if (!githubData.messages) githubData.messages = [];
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
    } catch(e) {
        alert("خطأ: " + e.message);
        logout();
    }
}

async function saveData() {
    document.getElementById('mainPanel').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    
    let token = localStorage.getItem("mytv_token");
    let contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(githubData, null, 2))));
    
    let res = await fetch(https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}, {
        method: "PUT",
        headers: { "Authorization": token ${token}, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Update from Panel", content: contentEncoded, sha: fileSha })
    });
    
    if (res.ok) {
        let newFile = await res.json();
        fileSha = newFile.content.sha;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
        
        let s = document.getElementById('successMsg');
        s.style.display = 'block';
        setTimeout(() => s.style.display = 'none', 4000);
    } else {
        alert("❌ حدث خطأ أثناء الإرسال.");
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
    }
}

function addApp() {
    let name = document.getElementById('appName').value.trim();
    let pkg = document.getElementById('appPackage').value.trim();
    if (!name || !pkg) return alert('أكمل بيانات التطبيق!');
    
    githubData.apps.push({ id: Date.now(), name: name, package: pkg });
    saveData();
    document.getElementById('appName').value = '';
    document.getElementById('appPackage').value = '';
}

function sendMessage() {
    let msg = document.getElementById('msgBody').value.trim();
    if (!msg) return alert('اكتب الرسالة!');
    
    githubData.messages.push({ id: "msg_" + Date.now(), body: msg });
    saveData();
    document.getElementById('msgBody').value = '';
}

// التشغيل التلقائي إذا كان الرمز محفوظاً
if(localStorage.getItem("mytv_token")) fetchData();
</script>

</body>
</html>
