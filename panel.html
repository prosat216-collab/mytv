<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الاحترافية</title>
    <style>
        body { font-family: sans-serif; background: #12141a; color: #fff; padding: 20px; }
        .card { background: #161b22; border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; background: #0c0d11; color: #ffb21e; border: 1px solid #444; }
        button { width: 100%; padding: 12px; background: #ffb21e; color: #000; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>➕ إضافة تطبيق جديد</h3>
        <input type="text" id="appName" placeholder="اسم التطبيق (مثال: Yacine TV)">
        <input type="text" id="appPkg" placeholder="اسم الحزمة (مثال: com.yacine.tv)">
        <button onclick="addApp()">إضافة التطبيق</button>
    </div>

    <div class="card">
        <h3>✉️ إرسال رسالة لكل الشاشات</h3>
        <textarea id="msgBody" rows="3" placeholder="اكتب الرسالة هنا..."></textarea>
        <button onclick="sendMessage()">إرسال الرسالة</button>
    </div>

    <script>
        // هذا الكود يتصل بـ GitHub مباشرة لتحديث الملف
        const TOKEN = "ضع_الرمز_السري_الجديد_هنا"; // ضع الـ Token الخاص بك هنا
        const REPO = "prosat216-collab/mytv";
        const PATH = "data.json";

        async function updateGithub(newData, message) {
            let res = await fetch(https://api.github.com/repos/${REPO}/contents/${PATH}, { headers: {"Authorization": "token " + TOKEN} });
            let file = await res.json();
            let content = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
            
            await fetch(https://api.github.com/repos/${REPO}/contents/${PATH}, {
                method: "PUT",
                headers: {"Authorization": "token " + TOKEN, "Content-Type": "application/json"},
                body: JSON.stringify({ message: message, content: content, sha: file.sha })
            });
            alert("✅ تم التحديث بنجاح! التلفاز سيستقبل البيانات قريباً.");
        }

        async function addApp() {
            let name = document.getElementById('appName').value;
            let pkg = document.getElementById('appPkg').value;
            // هنا يجب جلب البيانات أولاً ثم إضافتها وحفظها
            alert("تمت الإضافة! (يجب ربط الكود بالبيانات الحالية)");
        }
        
        function sendMessage() {
            let msg = document.getElementById('msgBody').value;
            // هنا تقوم اللوحة بإضافة الرسالة لملف data.json
            alert("تم إرسال الرسالة: " + msg);
        }
    </script>
</body>
</html>
