<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MyTV Control</title>
    <style>
        body { font-family: sans-serif; background: #0e1117; color: #fff; padding: 20px; text-align: center; }
        .card { background: #161b22; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; }
        button { background: #ffb21e; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card" id="loginBox">
        <h3>كلمة مرور المحل</h3>
        <input type="password" id="pass" placeholder="أدخل كلمة المرور">
        <button onclick="check()">دخول</button>
    </div>

    <div class="card" id="panelBox" style="display:none;">
        <h3>تفعيل كود تلفاز</h3>
        <input type="text" id="devCode" placeholder="مثال: BBF00">
        <button onclick="activate()">تفعيل الجهاز (انسخ الكود وحدث GitHub)</button>
        <p id="result" style="color:#ffb21e;"></p>
    </div>

    <script>
        function check() {
            if (document.getElementById('pass').value === '1234') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panelBox').style.display = 'block';
            } else {
                alert('كلمة المرور خطأ');
            }
        }
        function activate() {
            let code = document.getElementById('devCode').value.toUpperCase();
            let json = {\n  "shop": {"name": "محل إلكترو سات", "whatsapp": "21698000000", "welcome": "مرحباً بكم"}, \n  "devices": {\n    "tv": {"code": "${code}", "paired": true, "active": true}\n  }\n};
            document.getElementById('result').innerText = "انسخ هذا الكود وضعه في ملف data.json على GitHub: \n\n" + json;
        }
    </script>
</body>
</html>
