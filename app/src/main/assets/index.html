<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ SAT CONNECT</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0c11; font-family: sans-serif; color: #fff; overflow: hidden; user-select: none; }

.screen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0c11;
    text-align: center;
    padding-top: 50px;
}

.shop-name { font-size: 3.5rem; font-weight: bold; color: #ffb21e; margin-bottom: 10px; text-shadow: 0 4px 15px rgba(255,178,30,0.4); }
.welcome { font-size: 1.6rem; color: #f6e7c8; margin-bottom: 40px; }
.grid { width: 90%; margin: 0 auto; text-align: center; }

.app-card {
    display: inline-block;
    vertical-align: top;
    background: #161b22;
    border: 3px solid #333;
    border-radius: 15px;
    padding: 25px 15px;
    margin: 15px;
    width: 180px;
    cursor: pointer;
    outline: none;
    transition: transform 0.2s, border-color 0.2s;
}
.app-card:focus, .app-card:hover {
    border-color: #ffb21e;
    background: #221b10;
    transform: scale(1.1);
}
.app-icon { font-size: 3.5rem; margin-bottom: 10px; }
.app-name { font-size: 1.3rem; font-weight: bold; color: #fff; }

/* نافذة الرسائل التلقائية (تختفي بعد 5 ثوانٍ) */
#msgModal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999;
}
.msg-box {
    background: #161b22; border: 3px solid #ffb21e; padding: 40px;
    border-radius: 20px; max-width: 600px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.msg-title { color: #ffb21e; font-size: 2.2rem; margin-bottom: 20px; font-weight: bold; }
.msg-body { font-size: 1.8rem; color: #fff; line-height: 1.6; }
</style>
</head>
<body>

<!-- الشاشة الرئيسية تفتح مباشرة دائماً -->
<div id="scrHome" class="screen">
  <div class="shop-name" id="shopName">AZ SAT CONNECT</div>
  <div class="welcome" id="welcomeMsg">مرحباً بكم</div>
  <div class="grid" id="appsContainer"></div>
</div>

<!-- نافذة الرسائل المؤقتة (تختفي تلقائياً) -->
<div id="msgModal">
  <div class="msg-box">
    <div class="msg-title">✉️ إشعار من المحل</div>
    <div class="msg-body" id="msgText"></div>
  </div>
</div>

<script>
(function () {
  var N = window.MyTV || null;
  var DATA_URL = "https://raw.githubusercontent.com/prosat216-collab/mytv/main/data.json";
  var autoCloseTimer = null;

  function fetchConfig() {
    var url = DATA_URL + "?t=" + new Date().getTime();
    
    if (N && typeof N.fetchUrl === 'function') {
        N.fetchUrl(url);
    } else {
        fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) { renderHome(data); checkMessages(data); })
        .catch(function() {});
    }
  }

  window.onCloudData = function(ok, result) {
      if (ok) {
          try { 
              var data = JSON.parse(result);
              renderHome(data);
              checkMessages(data);
          } catch(e) {}
      }
  };
  window.__api = window.onCloudData;

  function renderHome(data) {
    if (data.shop) {
        document.getElementById('shopName').textContent = data.shop.name || 'AZ SAT CONNECT';
        document.getElementById('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم';
    }
    
    var grid = document.getElementById('appsContainer');
    grid.innerHTML = '';

    var apps = data.apps || [];
    for (var i = 0; i < apps.length; i++) {
      (function(app) {
        var btn = document.createElement('button');
        btn.className = 'app-card';
        btn.innerHTML = '<div class="app-icon">📺</div><div class="app-name">' + app.name + '</div>';
        btn.onclick = function() { 
            if (N && app.package) N.launch(app.package); 
        };
        grid.appendChild(btn);
      })(apps[i]);
    }
    
    var first = grid.querySelector('.app-card');
    if (first && document.activeElement !== first) first.focus();
  }

  function checkMessages(data) {
    if (data.messages && data.messages.length > 0) {
      var lastMsg = data.messages[data.messages.length - 1];
      var seenId = localStorage.getItem("last_msg_shown");
      
      if (seenId !== String(lastMsg.id)) {
         document.getElementById('msgText').textContent = lastMsg.body;
         document.getElementById('msgModal').style.display = 'flex';
         
         // حفظ أن هذه الرسالة ظهرت حتى لا تتكرر بلا داعٍ
         localStorage.setItem("last_msg_shown", String(lastMsg.id));

         // إخفاء الرسالة تلقائياً بعد 5 ثوانٍ بالضبط
         if (autoCloseTimer) clearTimeout(autoCloseTimer);
         autoCloseTimer = setTimeout(function() {
             document.getElementById('msgModal').style.display = 'none';
             var first = document.getElementById('appsContainer').querySelector('.app-card');
             if (first) first.focus();
         }, 5000); // 5000 مิลلي ثانية = 5 ثوانٍ
      }
    }
  }

  fetchConfig();
  setInterval(fetchConfig, 10000);
})();
</script>
</body>
</html>
