<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0c11; font-family: sans-serif; color: #fff; overflow: hidden; user-select: none; }

.screen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0c11;
    text-align: center;
    padding-top: 50px;
    display: none;
}

.logo { font-size: 4.5rem; font-weight: 900; color: #ffb21e; margin-bottom: 20px; }
.logo span { color: #fff; }
.code-box {
    display: inline-block;
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: 15px;
    padding: 10px 40px;
    border-radius: 15px;
    background: #141721;
    border: 3px solid #ffb21e;
    color: #fff;
    margin: 20px auto;
}
.sub-title { font-size: 2rem; color: #f6e7c8; margin-bottom: 15px; }
.desc { font-size: 1.3rem; color: #a59f92; max-width: 600px; margin: 0 auto; line-height: 1.6; }

.shop-name { font-size: 3.5rem; font-weight: bold; color: #ffb21e; margin-bottom: 10px; }
.welcome { font-size: 1.6rem; color: #f6e7c8; margin-bottom: 40px; }
.grid { width: 90%; margin: 0 auto; text-align: center; }

.app-card {
    display: inline-block;
    vertical-align: top;
    background: #161b22;
    border: 3px solid #333;
    border-radius: 15px;
    padding: 25px 15px;
    margin: 15px;
    width: 180px;
    cursor: pointer;
    outline: none;
}
.app-card:focus, .app-card:hover {
    border-color: #ffb21e;
    background: #221b10;
    transform: scale(1.1);
}
.app-icon { font-size: 3.5rem; margin-bottom: 10px; }
.app-name { font-size: 1.3rem; font-weight: bold; color: #fff; }

#msgModal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: none; z-index: 9999;
}
.msg-box {
    background: #161b22; border: 3px solid #ffb21e; padding: 35px;
    border-radius: 15px; max-width: 550px; margin: 100px auto 0 auto; text-align: center;
}
.msg-title { color: #ffb21e; font-size: 2rem; margin-bottom: 15px; font-weight: bold; }
.msg-body { font-size: 1.5rem; color: #fff; margin-bottom: 25px; line-height: 1.5; }
.msg-btn { background: #ffb21e; color: #000; border: none; padding: 12px 35px; font-size: 1.4rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<div id="scrPair" class="screen" style="display: block;">
  <div class="logo">My<span>TV</span></div>
  <div class="sub-title">اربط هذا الجهاز بمحلك</div>
  <div><span class="code-box" id="pairCode">7559E</span></div>
  <div class="desc">أعطِ هذا الكود لصاحب المحل لتفعيل الجهاز عن بعد من لوحة التحكم.</div>
</div>

<div id="scrHome" class="screen">
  <div class="shop-name" id="shopName">محل إلكترو سات</div>
  <div class="welcome" id="welcomeMsg">مرحباً بكم</div>
  <div class="grid" id="appsContainer"></div>
</div>

<div id="msgModal">
  <div class="msg-box">
    <div class="msg-title">✉️ رسالة من المحل</div>
    <div class="msg-body" id="msgText"></div>
    <button class="msg-btn" id="msgClose" onclick="closeMsg()">موافق</button>
  </div>
</div>

<script>
(function () {
  var N = window.MyTV || null;
  // هذا الرابط يعتمد على GitHub Pages المحدث فوراً بدون أي كاش
  var DATA_URL = "https://prosat216-collab.github.io/mytv/data.json";
  var myCode = "7559E";

  function fetchConfig() {
    var url = DATA_URL + "?t=" + new Date().getTime();
    
    fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var isPaired = false;
        if (data && data.devices) {
            for (var key in data.devices) {
                var d = data.devices[key];
                if (d.active === true && (key === myCode || d.code === myCode)) {
                    isPaired = true;
                    break;
                }
            }
        }

        if (isPaired) {
            renderHome(data);
            checkMessages(data);
        } else {
            document.getElementById('pairCode').textContent = myCode;
            document.getElementById('scrPair').style.display = 'block';
            document.getElementById('scrHome').style.display = 'none';
        }
    })
    .catch(function(err) {
        console.log("Error:", err);
    });
  }

  function renderHome(data) {
    if (data.shop) {
        document.getElementById('shopName').textContent = data.shop.name || 'محل إلكترو سات';
        document.getElementById('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم';
    }
    
    var grid = document.getElementById('appsContainer');
    grid.innerHTML = '';

    var apps = data.apps || [];
    for (var i = 0; i < apps.length; i++) {
      (function(app) {
        var btn = document.createElement('button');
        btn.className = 'app-card';
        btn.innerHTML = '<div class="app-icon">📺</div><div class="app-name">' + app.name + '</div>';
        btn.onclick = function() { 
            if (N && app.package) N.launch(app.package); 
        };
        grid.appendChild(btn);
      })(apps[i]);
    }

    document.getElementById('scrPair').style.display = 'none';
    document.getElementById('scrHome').style.display = 'block';
    
    var first = grid.querySelector('.app-card');
    if (first) first.focus();
  }

  window.closeMsg = function() {
      document.getElementById('msgModal').style.display = 'none';
  };

  function checkMessages(data) {
    if (data.messages && data.messages.length > 0) {
      var lastMsg = data.messages[data.messages.length - 1];
      var seenId = localStorage.getItem("last_msg");
      if (seenId !== String(lastMsg.id)) {
         document.getElementById('msgText').textContent = lastMsg.body;
         document.getElementById('msgModal').style.display = 'flex';
         document.getElementById('msgClose').focus();
      }
    }
  }

  fetchConfig();
  setInterval(fetchConfig, 5000); // فحص كل 5 ثوانٍ
})();
</script>
</body>
</html>
