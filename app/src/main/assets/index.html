<script>
(function () {
  var N = window.MyTV || null;
  // جلب التطبيقات واسم المحل مباشرة من ملف data.json
  var DATA_URL = "https://raw.githubusercontent.com/prosat216-collab/mytv/main/data.json";

  function loadLauncher() {
    fetch(DATA_URL + "?t=" + new Date().getTime())
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data.shop) {
            document.getElementById('shopNameDisp').textContent = data.shop.name || 'AZ SAT CONNECT';
            document.getElementById('welcomeDisp').textContent = data.shop.welcome || 'مرحباً بكم';
        }
        
        var grid = document.getElementById('appsContainer');
        grid.innerHTML = '';

        var apps = data.apps || [];
        for (var i = 0; i < apps.length; i++) {
          (function(app) {
            var btn = document.createElement('button');
            btn.className = 'app-btn';
            btn.innerHTML = '<div style="font-size:3rem">📺</div><div class="app-name">' + app.name + '</div>';
            btn.onclick = function() { 
                if (N && app.package) N.launch(app.package); 
            };
            grid.appendChild(btn);
          })(apps[i]);
        }

        // إظهار الشاشة الرئيسية مباشرة متجاوزين شاشة الكود
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
        document.getElementById('scrHome').classList.add('on');

        var first = grid.querySelector('.app-btn');
        if (first) first.focus();
    })
    .catch(function(e) {
        // إذا لم يكن هناك إنترنت، يفتح الواجهة الأساسية افتراضياً
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
        document.getElementById('scrHome').classList.add('on');
    });
  }

  // ساعة حية
  setInterval(function() {
    var d = new Date();
    document.getElementById('clockTime').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }, 1000);

  loadLauncher();
  setInterval(loadLauncher, 15000); // تحديث التطبيقات من السحاب كل 15 ثانية
})();
</script>
