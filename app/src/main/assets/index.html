<script>
(function () {
  var N = window.MyTV || null;
  // هذا هو الرابط الصحيح بصيغة CSV ليقرأه التطبيق
  var DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQk1L7jzKOmZL4tJVX5gmMUDBcrRL_WolRDVXVDo0l-TN6H1xgSbX8JXGE_PjsseafiBjlJoNMlT7To/pub?output=csv";
  
  var info = {};
  try { info = JSON.parse(N ? N.deviceInfo() : '{}'); } catch (e) { info = {}; }
  var myCode = (info.uid || 'tv-test').slice(-5).toUpperCase();

  function fetchConfig() {
    fetch(DATA_URL + "&t=" + new Date().getTime())
    .then(function(res){ return res.text(); })
    .then(function(csv){
      var rows = csv.split("\n");
      var isPaired = false;
      
      // نبحث عن كود التلفاز داخل الجدول
      for(var i=1; i<rows.length; i++){
        var cols = rows[i].split(",");
        if(cols[0] && cols[0].trim().toUpperCase() === myCode && cols[1].trim() === "true") {
           isPaired = true;
           break;
        }
      }

      if (isPaired) {
        renderHome();
      } else {
        document.getElementById('pairCode').textContent = myCode;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
        document.getElementById('scrPair').classList.add('on');
        setTimeout(fetchConfig, 10000);
      }
    });
  }

  function renderHome() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    document.getElementById('scrHome').classList.add('on');
  }

  fetchConfig();
})();
</script>
