<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MyTV</title>
<style>
:root{
  --ink:#0a0c11; --panel:rgba(16,16,20,.92); --line:rgba(225,180,95,.45);
  --text:#f6efe0; --cream:#f6e7c8; --muted:#a59f92;
  --amber:#ffb21e; --coral:#ff5a36; --ok:#3fd38a;
  --grad:linear-gradient(135deg,#ffb21e,#ff5a36);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:sans-serif;color:var(--text);user-select:none}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at center, #1f1b13 0%, #0a0c11 100%)}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex}
.gold{background:linear-gradient(135deg,#ffd27a,#ffb21e 50%,#ff5a36);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:5rem;font-weight:900;letter-spacing:2px;margin-bottom:1.5rem}
.logo .tv{color:var(--text)}
h1{font-size:2.2rem;margin-bottom:0.8rem}
.shop-title{font-size:4rem;font-weight:bold;margin-bottom:1rem;color:var(--amber);text-shadow: 0 4px 15px rgba(255, 178, 30, 0.4);}
.welcome-text{font-size:1.8rem;color:var(--cream);margin-bottom:3rem}
.apps-grid{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;max-width:90%}
.app-card{background:var(--panel);border:3px solid var(--line);border-radius:15px;padding:25px;display:flex;flex-direction:column;align-items:center;width:180px;cursor:pointer;outline:none;transition: transform 0.2s, border-color 0.2s;}
.app-card:focus,.app-card:hover{border-color:var(--amber);transform:scale(1.15);background:#221b10;box-shadow: 0 10px 25px rgba(255, 178, 30, 0.4);}
.app-name{margin-top:15px;font-size:1.4rem;font-weight:bold;color:#fff;}
</style>
</head>
<body>
<div id="bg"></div>

<!-- شاشة المحل الرئيسية -->
<section id="scrHome" class="screen on">
  <div class="shop-title" id="shopName">محل إلكترو سات</div>
  <div class="welcome-text" id="welcomeMsg">مرحباً بكم - أحدث التطبيقات والاشتراكات</div>
  <div class="apps-grid" id="appsContainer"></div>
</section>

<!-- السكريبت المباشر للتشغيل الفوري -->
<script>
(function () {
  var N = window.MyTV || null;

  // بيانات المحل والتطبيقات (تعمل بدون إنترنت)
  var localData = {
    apps: [
      { name: "YouTube", package: "com.google.android.youtube.tv" },
      { name: "IPTV Smarters", package: "com.iptvsmarters.smartersplayer" },
      { name: "إعدادات الجهاز", package: "com.android.tv.settings" }
    ]
  };

  function renderHome() {
    var grid = document.getElementById('appsContainer');
    grid.innerHTML = '';

    localData.apps.forEach(function(app){
      var btn = document.createElement('button');
      btn.className = 'app-card';
      btn.innerHTML = '<div style="font-size:4rem">📺</div><div class="app-name">' + app.name + '</div>';
      btn.onclick = function() {
        if (N && app.package) N.launch(app.package);
      };
      grid.appendChild(btn);
    });

    // تركيز الريموت على أول تطبيق
    setTimeout(function() {
        var first = grid.querySelector('.app-card');
        if (first) first.focus();
    }, 100);
  }

  // تشغيل الواجهة فوراً
  renderHome();
})();
</script>
</body>
</html>
