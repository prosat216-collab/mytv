<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MyTV</title>
<style>
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2193,U+2212,U+FEFF}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2193,U+2212,U+FEFF}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2193,U+2212,U+FEFF}
@font-face{font-family:Saira;font-weight:800;src:url(fonts/saira-condensed-latin-800-normal.woff2) format("woff2")}

:root{
  --ink:#0a0c11; --panel:rgba(16,16,20,.92); --line:rgba(225,180,95,.45); --line2:#2a3245;
  --text:#f6efe0; --cream:#f6e7c8; --muted:#a59f92;
  --amber:#ffb21e; --coral:#ff5a36; --ok:#3fd38a;
  --grad:linear-gradient(135deg,#ffb21e,#ff5a36);
}
/* every size is in rem; the root size follows the screen so the layout scales on any TV or phone */
/* the root size is set by layout() in the script (old Android TV browsers don't know CSS min()) */
html{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:Cairo,system-ui,sans-serif;color:var(--text);user-select:none}
img{display:block}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--ink) url(img/bg_tv.jpg) center/cover no-repeat}
.portrait #bg{background-image:url(img/bg_phone.jpg)}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
.gold{background:linear-gradient(135deg,#ffd27a,#ffb21e 50%,#ff5a36);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-family:Saira,sans-serif;font-weight:800;direction:ltr;letter-spacing:.1rem;line-height:1}
.logo .tv{color:var(--text)}
.ltr{direction:ltr;unicode-bidi:embed}

/* focus (remote control) */
.f{outline:none;transition:transform .15s}
.kb .f:focus{box-shadow:0 0 0 .22rem var(--amber),0 .6rem 1.8rem -.4rem rgba(255,178,30,.55)}
.kb .app.f:focus{box-shadow:none;transform:scale(1.1)}
.kb .app.f:focus .ring{border-color:#ffe3a3;box-shadow:0 0 0 .25rem rgba(255,178,30,.3),0 .6rem 2rem -.3rem rgba(255,178,30,.7)}
.kb .app.f:focus .name{color:#fff}

/* loading */
#scrLoading{align-items:center;justify-content:center}
#scrLoading .logo{font-size:8rem}
.spin{width:3rem;height:3rem;border-radius:50%;border:.3rem solid rgba(255,178,30,.2);border-top-color:var(--amber);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* pair */
#scrPair{align-items:center;justify-content:center;text-align:center;padding:2rem}
#scrPair .logo{font-size:5rem}
#scrPair h1{font-size:2rem;font-weight:800}
.code{font-family:Saira,Cairo,sans-serif;font-weight:800;direction:ltr;font-size:6.5rem;letter-spacing:1.4rem;padding:.6rem 2.6rem .6rem 4rem;border-radius:1.5rem;background:rgba(10,10,12,.6);border:.12rem solid var(--line);line-height:1.15}
.portrait .code{font-size:3.6rem;letter-spacing:.7rem;padding:.5rem 1.2rem .5rem 1.9rem}
#scrPair p{font-size:1.25rem;color:var(--cream);max-width:44rem;line-height:1.7}
.small{font-size:1rem!important;color:var(--muted)!important}

/* lock / error */
.center-card{margin:auto;width:92%;max-width:46rem;background:var(--panel);border:.1rem solid var(--line);border-radius:1.6rem;padding:2.2rem 2.4rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.center-card h1{font-size:2rem;font-weight:800;line-height:1.35}
.center-card p{font-size:1.2rem;color:var(--cream);line-height:1.7}
.qrbox{display:flex;flex-direction:column;align-items:center}
.qr{background:#fff;border-radius:.7rem;padding:.45rem;width:9rem;height:9rem}
.qr svg{width:100%;height:100%;display:block}
.qrnum{font-weight:800;font-size:1.2rem;direction:ltr}
.btns{display:flex;flex-wrap:wrap;justify-content:center}
.btn{font-size:1.2rem;font-weight:800;padding:.55rem 1.8rem;border-radius:.8rem;background:var(--grad);color:var(--ink);min-height:2.9rem}
.btn.ghost{background:rgba(10,10,12,.5);color:var(--amber);border:.1rem solid var(--line)}

/* home */
#scrHome{padding:2rem 3.6rem 1.6rem;justify-content:space-between}
.portrait #scrHome{padding:1.6rem 1.3rem 1.2rem}
.top{display:flex;justify-content:space-between;align-items:center}
.shop{display:flex;align-items:center;min-width:0}
.shop .lg{width:4.5rem;height:4.5rem;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:Saira,sans-serif;font-weight:800;font-size:1.8rem;color:var(--ink);border:.12rem solid var(--line)}
.portrait .shop .lg{width:3.4rem;height:3.4rem;font-size:1.4rem}
.shop b{display:block;font-size:1.9rem;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait .shop b{font-size:1.35rem}
.shop small{font-size:.95rem;color:var(--muted)}
.clock{text-align:start;flex-shrink:0}
.clock b{display:block;font-size:2.1rem;font-weight:700;direction:ltr;line-height:1.1}
.clock small{font-size:.95rem;color:var(--muted)}
.portrait .clock{display:none}
.offline{display:none;font-size:.85rem;color:#ffb3a3;background:rgba(58,22,18,.7);border-radius:99rem;padding:.1rem .8rem;margin-top:.2rem}
.is-offline .offline{display:inline-block}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.welcome{font-size:1.75rem;font-weight:700;color:var(--cream);background:rgba(10,10,12,.55);border:.08rem solid var(--line);border-radius:99rem;padding:.5rem 2.2rem;text-align:center;max-width:90%}
.portrait .welcome{font-size:1.2rem;padding:.5rem 1.2rem}
#apps{display:flex;flex-wrap:wrap;justify-content:center;max-width:66rem;max-height:100%;overflow-y:auto;padding:1rem}
.portrait #apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:1.3rem .6rem;padding:.6rem}
.app{display:flex;flex-direction:column;align-items:center;width:9.4rem;position:relative}
.portrait .app{width:auto}
.ring{width:8.6rem;height:8.6rem;border-radius:50%;padding:.32rem;border:.25rem solid var(--amber);transition:box-shadow .2s,border-color .2s;position:relative}
.portrait .ring{width:5.9rem;height:5.9rem;border-width:.2rem;padding:.22rem}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:contain}
.ring .ph{width:100%;height:100%;border-radius:50%;background:#1c2230;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem}
.prog{position:absolute;top:-.25rem;left:-.25rem;width:calc(100% + .5rem);height:calc(100% + .5rem);transform:rotate(-90deg);display:none}
.prog circle{fill:none;stroke-width:6}
.prog .bgc{stroke:rgba(0,0,0,.55)}
.prog .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .3s}
.busy .prog{display:block}
.busy.indet .prog{animation:sp 1.2s linear infinite}
.name{font-size:1.15rem;font-weight:700;color:var(--text);text-align:center;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.portrait .name{font-size:.95rem}
.badge{font-size:.85rem;font-weight:800;padding:.05rem .75rem;border-radius:99rem;min-height:1.4rem;white-space:nowrap}
.portrait .badge{font-size:.72rem;padding:0 .55rem}
.badge.ok{color:var(--muted);font-weight:700}
.badge.dl{background:#2a3245;color:var(--text)}
.badge.up{background:var(--amber);color:var(--ink)}
.badge.run{background:var(--ok);color:var(--ink)}
.noapps{display:none;font-size:1.3rem;color:var(--cream);background:rgba(10,10,12,.6);border:.08rem dashed var(--line);border-radius:1rem;padding:.8rem 1.8rem;text-align:center;max-width:90%;line-height:1.6}
.noapps.on{display:block}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.hint{font-size:1rem;color:var(--muted)}
.renew{display:flex;align-items:center}
.renew .txt{text-align:end}
.renew .txt b{display:block;font-size:1.05rem;color:var(--cream);font-weight:700}
.renew .txt small{font-size:.85rem;color:var(--muted)}
.renew .qr{width:6.6rem;height:6.6rem;padding:.35rem}
.wa{display:none}
.portrait .bottom{display:block}
.portrait .bottom .hint,.portrait .renew{display:none}
.portrait .wa{display:flex;flex-direction:column;background:var(--panel);border:.08rem solid var(--line);border-radius:1.1rem;padding:1rem}
.wa small{font-size:.9rem;color:var(--cream)}
.wa .btn{display:flex;align-items:center;justify-content:center}
.wa .num{text-align:center;font-size:.95rem;color:var(--muted);direction:ltr}

/* settings */
#scrSettings{padding:2rem 3.6rem;overflow-y:auto}
.portrait #scrSettings{padding:1.6rem 1.3rem}
#scrSettings h1{font-size:1.7rem;font-weight:800;max-width:64rem;width:100%;margin:0 auto 1.2rem}
.set-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:1.6rem;align-items:start;max-width:64rem;width:100%;margin:0 auto}
.portrait .set-grid{grid-template-columns:1fr}
.card{background:var(--panel);border:.08rem solid var(--line);border-radius:1.1rem;padding:1.1rem 1.3rem;display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;border-bottom:.06rem solid #232835;padding:.35rem 0}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:800;text-align:end}
.kv .code-s{font-family:Saira,Cairo,sans-serif;letter-spacing:.25rem;font-size:1.25rem;direction:ltr}
.set-btn{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:1rem;font-weight:700;padding:.5rem 1rem;border-radius:.8rem;background:rgba(10,10,12,.55);border:.08rem solid var(--line2);text-align:start;min-height:2.7rem}
.set-btn em{font-style:normal;color:var(--amber);font-weight:800}

/* modal */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:1.2rem;z-index:10}
#modal.on{display:flex}
#modal .box{width:100%;max-width:46rem;max-height:100%;overflow-y:auto;background:var(--panel);border:.12rem solid var(--line);border-radius:1.6rem;padding:2rem 2.2rem;display:flex;flex-direction:column;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
#modal h2{font-size:1.9rem;font-weight:800;line-height:1.35;display:flex;align-items:center}
#modal .ic{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#modal .ic svg{width:1.9rem;height:1.9rem}
#modal .row{display:flex;align-items:center;background:rgba(10,10,12,.6);border-radius:1rem;padding:1.2rem}
.portrait #modal .row{flex-direction:column;text-align:center}
#modal .row p,#modal .body{flex:1;overflow-wrap:anywhere;font-size:1.2rem;line-height:1.7;color:var(--cream);white-space:pre-line}
#modal .foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
#modal .foot small{font-size:.9rem;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:2.4rem;transform:translateX(-50%);background:rgba(16,16,20,.95);border:.08rem solid var(--line);border-radius:99rem;padding:.6rem 1.8rem;font-size:1.15rem;font-weight:700;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

/* spacing with margins (flex "gap" is missing in older Android TV browsers) */
#scrLoading .logo{margin-bottom:2rem}
#scrPair>*+*{margin-top:1.3rem}
.center-card>*+*{margin-top:1.3rem}
.qrnum{margin-top:.4rem}
.btns{margin:-.4rem}
.btns>*{margin:.4rem}
.shop>*+*{margin:0 1rem}
.welcome{margin-bottom:1.6rem}
#apps{margin:-.6rem}
.app{margin:.8rem .55rem}
.portrait .app{margin:0}
.app .name{margin-top:1.1rem}
.app .badge{margin-top:.35rem}
.portrait .app .name{margin-top:.7rem}
.renew>*+*{margin:0 1rem}
.wa>*+*{margin-top:.5rem}
.wa .btn svg{margin:0 .5rem}
.card>*+*{margin-top:.6rem}
.kv>*+*{margin:0 1rem}
.set-btn>*+*{margin:0 1rem}
#modal .box>*+*{margin-top:1.3rem}
#modal h2>*+*{margin:0 .9rem}
#modal .row>*+*{margin:0 1.6rem}
.portrait #modal .row>*+*{margin:1rem 0 0}
#modal .foot small{margin:.3rem 1rem .3rem 0}
.noapps{margin-top:1.4rem}

/* ---------- weather + prayer times ---------- */
.topleft{display:flex;align-items:center}
.wx{display:none;align-items:center;background:rgba(10,10,12,.55);border:.08rem solid var(--line);border-radius:1.1rem;padding:.45rem 1.1rem;margin:0 1.4rem}
.wx.on{display:flex}
.wx svg{width:3rem;height:3rem;flex-shrink:0}
.wx .t{font-size:2.2rem;font-weight:800;direction:ltr;margin:0 .7rem;line-height:1}
.wx .d{font-size:.9rem;line-height:1.35;color:#c9bfa8}
.wx .d b{display:block;color:var(--text);font-size:1rem}
.wx .d i{display:block;font-style:normal;font-size:.62rem;color:#7d7869;direction:ltr;text-align:start}
.pray{display:none;align-items:stretch;background:rgba(10,10,12,.6);border:.08rem solid var(--line);border-radius:1.1rem;padding:.35rem;margin:0 auto}
.pray.on{display:flex}
.pray .p{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.35rem 1.05rem;border-radius:.8rem;min-width:5.6rem}
.pray .p small{font-size:.85rem;color:var(--muted)}
.pray .p b{font-size:1.25rem;font-weight:800;direction:ltr;line-height:1.2}
.pray .p.next{background:var(--grad);color:var(--ink)}
.pray .p.next small{color:#2a1d0b;font-weight:700}
.pray .p em{font-style:normal;font-size:.75rem;font-weight:800;margin-top:.1rem;white-space:nowrap}
.pray .city{display:flex;flex-direction:column;justify-content:center;padding:0 1rem;font-size:.85rem;color:var(--muted);border-left:.06rem solid var(--line2);margin-left:.3rem}
html[dir=ltr] .pray .city{border-left:0;border-right:.06rem solid var(--line2);margin:0 .3rem 0 0}
.pray .city b{color:var(--text);font-size:.95rem}
.with-pray .bottom .hint{display:none}
.bottom{align-items:center}
.portrait .wx{margin:0;padding:.35rem .7rem}
.portrait .wx svg{width:2.1rem;height:2.1rem}
.portrait .wx .t{font-size:1.5rem;margin:0 .4rem}
.portrait .wx .d{display:none}
.portrait .pray{margin:0 0 1rem;width:100%;justify-content:space-between;padding:.25rem}
.portrait .pray .p{min-width:0;padding:.3rem .2rem;flex:1}
.portrait .pray .p small{font-size:.7rem}
.portrait .pray .p b{font-size:.92rem}
.portrait .pray .p em{font-size:.6rem}
.portrait .pray .city{display:none}
.portrait .top .topleft{order:2}
.toggle{display:inline-block;width:3rem;height:1.6rem;border-radius:99rem;background:#3a4560;position:relative;vertical-align:middle;flex-shrink:0}
.toggle:after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--ok)}
.toggle.on:after{left:1.6rem}
#modal .btn.cur{box-shadow:inset 0 0 0 .15rem var(--ink)}

/* ---------- store (shop product photos) ---------- */
.bagic{width:100%;height:100%;border-radius:50%;background:#14130f;background:radial-gradient(circle at 50% 35%,#2a2418,#101114 70%);display:flex;align-items:center;justify-content:center}
.bagic svg{width:52%;height:52%}
.newdot{display:none;position:absolute;top:.35rem;left:.35rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#ff3b30;border:.22rem solid #0a0c11;box-shadow:0 0 .8rem rgba(255,59,48,.8)}
.has-new .newdot{display:block}
.portrait .newdot{width:1.15rem;height:1.15rem;top:.15rem;left:.15rem}
#scrStore{padding:1.6rem 3.4rem .9rem;background:rgba(8,9,12,.55)}
.sthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-shrink:0}
.sthead h1{font-size:2rem;font-weight:800;display:flex;align-items:center;white-space:nowrap}
.sthead h1 svg{width:2.2rem;height:2.2rem;margin-left:.7rem;flex-shrink:0}
html[dir=ltr] .sthead h1 svg{margin:0 .7rem 0 0}
.sthead .gold{margin:0 .5rem}
.sthead .side{display:flex;align-items:center}
.sthead small{color:var(--muted);font-size:1.05rem}
.stback{display:flex;align-items:center;font-size:1.05rem;font-weight:700;color:var(--cream);border:.08rem solid var(--line);border-radius:99rem;padding:.3rem 1.1rem;margin:0 1.2rem;background:rgba(10,10,12,.6)}
.kb .stback:focus{border-color:var(--amber);box-shadow:0 0 0 .2rem rgba(255,178,30,.35)}
#stGrid{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -.6rem;padding:.4rem 0}
.ph1{display:block;width:25%;padding:.6rem;position:relative}
.ph1 .im{position:relative;padding-top:75%;border-radius:1rem;overflow:hidden;border:.18rem solid rgba(255,255,255,.08);background:#15161a;transition:transform .15s,box-shadow .15s}
.ph1 .im img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.kb .ph1.f:focus{box-shadow:none}
.kb .ph1:focus .im{border-color:var(--amber);box-shadow:0 0 0 .3rem rgba(255,178,30,.3),0 .6rem 2rem -.3rem rgba(255,178,30,.7);transform:scale(1.04)}
.ph1 .tag{position:absolute;top:1.1rem;right:1.1rem;background:#ff3b30;color:#fff;font-weight:800;font-size:.85rem;padding:.05rem .6rem;border-radius:.5rem}
html[dir=ltr] .ph1 .tag{right:auto;left:1.1rem}
.sthint{color:var(--muted);text-align:center;margin-top:.5rem;font-size:1rem;flex-shrink:0}
.portrait #scrStore{padding:1.2rem 1rem .5rem}
.portrait .sthead h1{font-size:1.6rem}
.portrait .sthead small,.portrait .sthint,.portrait .sthead .gold{display:none}
.portrait .stback{margin:0}
.portrait .ph1{width:50%;padding:.45rem}
.portrait .ph1 .im{padding-top:100%}
#scrPhoto{background:#000}
#phBig{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center}
#phImg{width:100%;height:100%;object-fit:contain}
.pcount{position:absolute;top:1.4rem;right:1.6rem;background:rgba(10,10,14,.75);border-radius:2rem;padding:.3rem 1.1rem;font-weight:800;font-size:1.1rem;direction:ltr}
html[dir=ltr] .pcount{right:auto;left:1.6rem}
.arr{position:absolute;top:50%;margin-top:-2.2rem;width:4.4rem;height:4.4rem;border-radius:50%;background:rgba(10,10,14,.7);border:.12rem solid var(--line);display:flex;align-items:center;justify-content:center}
.arr svg{width:2rem;height:2rem}
.arr.r{right:1.6rem}
.arr.l{left:1.6rem}
.dots{position:absolute;bottom:2rem;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.dots i{width:.7rem;height:.7rem;border-radius:.5rem;background:rgba(255,255,255,.35);margin:0 .25rem}
.dots i.on{background:var(--amber);width:1.8rem}

var MUSHAF = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 20c-6-4-14-5-22-4v32c8-1 16 0 22 4 6-4 14-5 22-4V16c-8-1-16 0-22 4z" fill="url(#gBag)"></path><path d="M32 20v32" stroke="#101114" stroke-width="2.5"></path><path d="M32 4l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8-3.5-3.4 4.8-.7z" fill="#ffd27a"></path></svg>';
var ICO_PLAY = '<svg viewBox="0 0 24 24" fill="#0a0c11" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>';
var ICO_PAUSE = '<svg viewBox="0 0 24 24" fill="#0a0c11" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"></rect><rect x="13.5" y="5" width="4" height="14" rx="1"></rect></svg>';
var ICO_WAIT = '<svg viewBox="0 0 24 24" fill="none" stroke="#0a0c11" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>';
var q = { on: false, r: 0, s: 0, list: [], i: 0, paused: false, wait: false, errs: 0, a: null, next: null };
var qPickR = 0;
function quranOn() { return pget('quran') !== '0' && QD.reciters.length > 0; }
function pad3(n) { return ('00' + n).slice(-3); }
function qName(sn) { return sn === 0 ? t('ruqyah') : (lang === 'fr' ? QD.fr[sn - 1] : QD.ar[sn - 1]); }
function rName(r) { var x = QD.reciters[r]; return x ? (lang === 'fr' ? x.fr : x.ar) : ''; }
function qList(r, sn) {
  var R = QD.reciters[r], out = [];
  if (sn > 0) return [R.surah + pad3(sn) + '.mp3'];
  if (!R.ayah) return QD.ruqyahShort.map(function (x) { return R.surah + pad3(x) + '.mp3'; });
  QD.ruqyah.forEach(function (g) {
    if (g[1] === 1 && g[0] !== 1 && g[0] !== 9) out.push(R.ayah + '001001.mp3');   // البسملة قبل أول السورة
    for (var a = g[1]; a <= g[2]; a++) out.push(R.ayah + pad3(g[0]) + pad3(a) + '.mp3');
  });
  return out;
}
function qLast() { var p = String(pget('qLast') || '').split(','); return { r: +p[0] || 0, s: p.length > 1 ? +p[1] : -1 }; }

function qAudio(src) {
  var a = new Audio();
  a.preload = 'auto';
  a.src = src;
  a.addEventListener('ended', function () { if (a === q.a) qEnded(); });
  a.addEventListener('error', function () { if (a === q.a) qError(); });
  a.addEventListener('playing', function () { if (a === q.a) { q.wait = false; q.errs = 0; qRenderBar(); } });
  a.addEventListener('waiting', function () { if (a === q.a) { q.wait = true; qRenderBar(); } });
  a.addEventListener('timeupdate', function () { if (a === q.a) qProgress(); });
  return a;
}
function qKill(a) { if (!a) return; try { a.pause(); a.removeAttribute('src'); a.load(); } catch (e) {} }
function qPlayIdx(i) {
  q.i = i;
  var src = q.list[i], a;
  if (q.next && q.next.getAttribute('src') === src && !q.next.error) { a = q.next; q.next = null; } else { qKill(q.next); q.next = null; a = qAudio(src); }
  qKill(q.a); q.a = a;
  q.paused = false; q.wait = true;
  var pr = a.play();
  if (pr && pr.catch) pr.catch(function (e) { if (a === q.a && e && e.name === 'NotAllowedError') { q.paused = true; q.wait = false; qRenderBar(); } });
  // الآية اللي بعدها تتحضّر من توّا باش ما يكونش سكوت بين الآيات
  if (i + 1 < q.list.length) q.next = qAudio(q.list[i + 1]);
  qRenderBar();
}
function qStart(r, sn) {
  q.on = true; q.r = r; q.s = sn; q.list = qList(r, sn); q.errs = 0;
  pset('qLast', r + ',' + sn);
  qPlayIdx(0);
}
function qEnded() {
  if (q.i + 1 < q.list.length) { qPlayIdx(q.i + 1); return; }
  if (q.s > 0 && q.s < 114) { q.s++; q.list = qList(q.r, q.s); pset('qLast', q.r + ',' + q.s); qPlayIdx(0); return; }
  qStop();
}
function qError() {
  q.errs++;
  // آية ناقصة في الرقية: نتعدّاو للي بعدها. مشكل انترنت (برشا أخطاء ورا بعضهم): نوقفو
  if (q.errs < 3 && q.i + 1 < q.list.length) { qPlayIdx(q.i + 1); return; }
  qStop(); toast(t('qErr'));
}
function qToggle() {
  if (!q.on || !q.a) return;
  if (q.paused) { q.paused = false; var pr = q.a.play(); if (pr && pr.catch) pr.catch(function () {}); }
  else { q.paused = true; q.a.pause(); }
  qRenderBar();
}
function qPause() { if (q.on && q.a && !q.paused) { q.paused = true; q.a.pause(); qRenderBar(); } }
function qStop() {
  if (!q.on) return;
  q.on = false; qKill(q.a); qKill(q.next); q.a = q.next = null;
  var wasFocused = document.activeElement && document.activeElement.parentNode === $('qbar');
  qRenderBar();
  if (wasFocused) { var b = $('appQuran') || $('appSet'); if (b) b.focus(); }
}
function qProgress() {
  var a = q.a; if (!a) return;
  var f = a.duration > 0 ? a.currentTime / a.duration : 0;
  $('qbP').style.width = (100 * (q.list.length > 1 ? (q.i + f) / q.list.length : f)).toFixed(1) + '%';
}
function qRenderBar() {
  var bar = $('qbar');
  bar.classList.toggle('on', q.on);
  if (!q.on) return;
  $('qbT').textContent = qName(q.s);
  $('qbS').textContent = rName(q.r);
  bar.classList.toggle('wait', q.wait && !q.paused);
  $('qbPlay').innerHTML = q.paused ? ICO_PLAY : (q.wait ? ICO_WAIT : ICO_PAUSE);
  qProgress();
}
function openQuran() {
  var last = qLast(), cur = q.on ? q.r : -1, h = '';
  QD.reciters.forEach(function (R, i) {
    h += '<button class="qr1 f" data-r="' + i + '"' + (i === (q.on ? q.r : last.r) ? ' data-first' : '') + '><div class="c">' +
      (i === cur ? '<em>' + esc(t('qNow')) + '</em>' : '') + '<b>' + esc(rName(i)) + '</b><small>' + esc(t('rw_' + R.rw)) + '</small></div></button>';
  });
  $('qrGrid').innerHTML = h;
  if (screen === 'scrQuran') { screen = ''; }
  show('scrQuran');
  if (screen === 'scrQuran') setTimeout(function () { var el = $('qrGrid').querySelector('[data-r="' + qPickR + '"]'); if (el && document.activeElement && !document.activeElement.hasAttribute('data-r')) el.focus(); }, 40);
}
function openSurahs(r) {
  qPickR = r;
  var last = qLast(), mark = q.on && q.r === r ? q.s : (last.r === r ? last.s : -1);
  var h = '<button class="qs1 ruq f" data-s="0"' + (mark <= 0 ? ' data-first' : '') + '><div class="c">' + MUSHAF.replace('<svg ', '<svg style="width:2.2rem;height:2.2rem;flex-shrink:0" ') +
    '<b>' + esc(t('ruqyah')) + '</b><small>' + esc(t('ruqyahSub')) + '</small></div></button>';
  for (var n = 1; n <= 114; n++) {
    h += '<button class="qs1 f' + (n === mark ? ' cur' : '') + '" data-s="' + n + '"' + (n === mark ? ' data-first' : '') + '><div class="c"><i>' + n + '</i><b>' + esc(qName(n)) + '</b></div></button>';
  }
  $('qsTitle').textContent = rName(r);
  $('qsGrid').innerHTML = h;
  $('qsGrid').scrollTop = 0;
  show('scrSurah');
  setTimeout(function () { var el = document.activeElement; if (el && el.scrollIntoView && el.hasAttribute('data-s')) el.scrollIntoView({ block: 'center' }); }, 60);
}
function upTo(el, attr) { while (el && el !== document && !(el.hasAttribute && el.hasAttribute(attr))) el = el.parentNode; return el && el.hasAttribute && el.hasAttribute(attr) ? el : null; }
$('qrGrid').addEventListener('click', function (e) { var b = upTo(e.target, 'data-r'); if (b) openSurahs(+b.getAttribute('data-r')); });
$('qsGrid').addEventListener('click', function (e) {
  var b = upTo(e.target, 'data-s'); if (!b) return;
  qStart(qPickR, +b.getAttribute('data-s'));
  screen = ''; render();
  setTimeout(function () { var p = $('qbPlay'); if (p) p.focus(); }, 80);
});
$('qrBack').addEventListener('click', function () { window.appBack(); });
$('qsBack').addEventListener('click', function () { window.appBack(); });
$('qbPlay').addEventListener('click', qToggle);
$('qbStop').addEventListener('click', qStop);
// خرج من MyTV (حل تطبيق، رجع للشاشة الرئيسية متاع الجهاز...): التلاوة توقف
window.onNativePause = function () { qPause(); };
document.addEventListener('visibilitychange', function () { if (document.hidden) qPause(); });

// ------------------------------------------------------------ settings
function openSettings() { renderSettings(); show('scrSettings'); }
function renderSettings() {
  var shop = (cfg && cfg.shop) || {}, c = (cfg && cfg.client) || {};
  var rows = [
    [t('devCode'), '<b class="code-s">' + esc((cfg && cfg.code) || '-----') + '</b>'],
    [t('shopL'), '<b>' + esc(shop.name || t('none')) + '</b>'],
    [t('subL'), '<b>' + esc(c.expires ? t('untilD', { d: fmtIso(c.expires) }) : t('none')) + '</b>'],
    [t('devL'), '<b class="ltr">' + esc(info.model || '') + '</b>'],
    [t('verL'), '<b class="ltr">' + esc(info.ver || '') + '</b>']
  ];
  $('setInfo').innerHTML = rows.map(function (r) { return '<div class="kv"><span>' + esc(r[0]) + '</span>' + r[1] + '</div>'; }).join('');
  $('setLangVal').textContent = lang === 'fr' ? 'Français' : 'العربية';
  var pl = place();
  $('setCityVal').textContent = cityName(pl) + (pl.cc === detectCountry() ? '' : ' · ' + countryName(pl.cc));
  $('setPrayVal').classList.toggle('on', prayOn());
  $('setWxVal').classList.toggle('on', wxOn());
  $('setQuranVal').classList.toggle('on', quranOn());
  $('setUpdateVal').textContent = updateAvailable() ? t('updNew', { v: cfg.mytv.version_name }) : t('updLatest');
}

// ------------------------------------------------------------ wiring
$('pairSettings').addEventListener('click', openSettings);
$('lockSettings').addEventListener('click', openSettings);
$('lockWa').addEventListener('click', function () { openWa(cfg && cfg.shop); });
$('lockRetry').addEventListener('click', refresh);
$('errRetry').addEventListener('click', function () { show('scrLoading'); refresh(); });
$('errWifi').addEventListener('click', function () { if (N) N.openSystem('wifi'); });
$('homeWa').addEventListener('click', function () { openWa(cfg && cfg.shop); });
$('setLang').addEventListener('click', function () {
  lang = lang === 'fr' ? 'ar' : 'fr'; pset('lang', lang); applyLang(); appsSig = ''; renderSettings();
  if (cfg && cfg.active) renderHome();
});
$('setCity').addEventListener('click', function () { pickCity(); });
$('setPray').addEventListener('click', function () { pset('pray', prayOn() ? '0' : '1'); praySig = ''; renderSettings(); renderPray(); });
$('setWx').addEventListener('click', function () { pset('wx', wxOn() ? '0' : '1'); renderSettings(); renderWx(); loadWx(true); });
$('setQuran').addEventListener('click', function () { pset('quran', quranOn() ? '0' : '1'); if (!quranOn()) qStop(); renderSettings(); });
$('setWifi').addEventListener('click', function () { if (N) N.openSystem('wifi'); });
$('setSystem').addEventListener('click', function () { if (N) N.openSystem('settings'); });
$('setApps').addEventListener('click', function () { if (N) N.openSystem('apps'); });
$('setUpdate').addEventListener('click', function () {
  if (updateAvailable()) { selfUpdate(); return; }
  refresh().then(function () { renderSettings(); if (updateAvailable()) offerUpdate(true); else toast(t('updLatest')); });
});
$('setRefresh').addEventListener('click', function () { refresh().then(function () { if (!offline) toast(t('tRefreshed')); }); });
$('setBack').addEventListener('click', function () { window.appBack(); });

function layout() {
  var w = window.innerWidth, h = window.innerHeight;
  var portrait = h > w * 1.05;
  document.documentElement.classList.toggle('portrait', portrait);
  var unit = portrait ? Math.min(w / 390, h / 844) : Math.min(w / 1280, h / 720);
  document.documentElement.style.fontSize = (unit * 16).toFixed(2) + 'px';
}
window.addEventListener('resize', layout);
layout();

function tick() {
  var d = new Date();
  $('clockTime').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  $('clockDate').textContent = fmtDate(d);
  if (screen === 'scrHome') renderPray();
}
setInterval(tick, 10000); tick();
setInterval(function () { if (screen === 'scrHome') loadWx(false); }, 5 * 60 * 1000);
if (info.type === 'tv') document.body.classList.add('kb');

applyLang();
if (cfg) render();      // show the last known screen straight away, then update
refresh();
})();
</script>
</body>
</html>
