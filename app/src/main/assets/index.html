<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CONNECT TV</title>
<style>
:root{--ink:#06080d;--panel:rgba(10,16,26,.95);--line:rgba(56,189,248,.4);--text:#f0f9ff;--accent:#38bdf8;--grad:linear-gradient(135deg,#38bdf8,#0284c7)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ink);color:var(--text);font-family:system-ui,sans-serif;overflow:hidden}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex}
.logo{font-size:3rem;font-weight:900;color:var(--accent);margin-bottom:2rem}
.btn{background:var(--grad);padding:15px 30px;border-radius:10px;font-weight:bold;color:#000;border:0;cursor:pointer}
#scrHome{padding:2rem;justify-content:flex-start}
#apps{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;width:100%}
.app-card{background:var(--panel);border:2px solid var(--line);padding:20px;border-radius:15px;width:160px;text-align:center;color:#fff}
</style>
</head>
<body>
<section id="scrHome" class="screen on">
    <div class="logo">CONNECT <span>TV</span></div>
    <div id="apps"></div>
</section>

<script>
(function(){
  var N = window.MyTV || null;
  var SERVER = "https://azsatconnect.alwaysdata.net";
  var info = {}; try{ info = JSON.parse(N ? N.deviceInfo() : '{}'); }catch(e){}

  function renderApps(apps) {
    var container = document.getElementById('apps');
    container.innerHTML = '';
    
    // زر الإعدادات
    var setBtn = document.createElement('button');
    setBtn.className = 'app-card';
    setBtn.innerHTML = '<div>⚙️</div><b>الإعدادات</b>';
    setBtn.onclick = function() { if(N) N.openSystem('settings'); };
    container.appendChild(setBtn);

    apps.forEach(function(a){
      var btn = document.createElement('button');
      btn.className = 'app-card';
      btn.innerHTML = (a.icon ? '<img src="'+a.icon+'" style="width:50px;height:50px;margin:auto">' : '📺') + '<b>'+a.name+'</b>';
      btn.onclick = function(){ 
          if(N && a.apk) N.download('a'+a.id, a.apk);
          else if(N) N.launch(a.package);
      };
      container.appendChild(btn);
    });
  }

  function loadData() {
    fetch(SERVER + '/api/device.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ action: 'config', uid: info.uid || 'test-tv', model: 'Android TV' })
    })
    .then(r => r.json())
    .then(data => { renderApps(data.apps || []); })
    .catch(e => { console.log(e); });
  }

  loadData();
})();
</script>
</body>
</html>
