<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CONNECT TV</title>
<style>
:root{--ink:#04060a;--panel:rgba(10,16,28,.95);--line:rgba(56,189,248,.4);--line2:#1e293b;--text:#f0f9ff;--cream:#e0f2fe;--muted:#94a3b8;--accent:#38bdf8;--accent2:#7dd3fc;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--live:#ef4444;--grad:linear-gradient(135deg,#38bdf8,#0284c7);--bgc:#0c1524}
html{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,sans-serif;color:var(--text);user-select:none}
img{display:block}button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;inset:0;background:radial-gradient(circle at center,var(--bgc) 0%,#030712 100%)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;width:100vw;height:100vh;overflow:hidden;z-index:2}.screen.on{display:flex}
.accent-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.f{outline:none;transition:transform .15s}.kb .f:focus{box-shadow:0 0 0 .22rem var(--accent2),0 .5rem 1.8rem -.3rem var(--line);transform:scale(1.04)}

#scrLoading,#scrPair{align-items:center;justify-content:center;text-align:center;padding:2rem}
.code{font-family:monospace;font-weight:900;direction:ltr;font-size:5.2rem;letter-spacing:1.1rem;padding:.55rem 2.8rem;border-radius:1.4rem;background:rgba(10,16,26,.85);border:.15rem solid var(--accent);color:#fff;margin:1.2rem 0}

#scrHome{padding:1.4rem 3rem 1.2rem;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.lg{width:4.8rem;height:4.8rem;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.8rem;color:#041320;border:.16rem solid var(--accent);overflow:hidden}.lg img{width:100%;height:100%;object-fit:cover}
.top-brand{flex:1;text-align:center;padding:0 1rem;min-width:0}
.top-brand b{display:block;font-size:2.55rem;font-weight:900;line-height:1.1;letter-spacing:.05rem;white-space:nowrap;text-shadow:0 .2rem 1rem rgba(0,0,0,.6)}.top-brand small{display:block;font-size:.95rem;color:var(--muted);margin-top:.2rem}
.clock{text-align:start;flex-shrink:0}.clock b{block;font-size:2.1rem;font-weight:700;direction:ltr;line-height:1.1;color:var(--accent)}.clock small{font-size:.88rem;color:var(--muted)}
.topleft{display:flex;align-items:center;flex-shrink:0}
.wx{display:flex;align-items:center;background:rgba(15,23,42,.65);border:.08rem solid var(--line);border-radius:1.1rem;padding:.4rem 1rem;margin:0 1rem 0 0}
.wx .t{font-size:2rem;font-weight:800;direction:ltr;margin:0 .6rem;line-height:1;color:var(--accent)}.wx .d{font-size:.85rem;line-height:1.35;color:#cbd5e1}.wx .d b{display:block;color:#fff;font-size:.95rem}

.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.welcome{font-size:1.45rem;font-weight:700;color:var(--cream);background:rgba(15,23,42,.7);border:.08rem solid var(--line);border-radius:99rem;padding:.4rem 2.2rem;text-align:center;margin-bottom:1.1rem}
#apps{display:flex;flex-wrap:wrap;justify-content:center;max-width:72rem;max-height:100%;overflow-y:auto;padding:.5rem}
.app{display:flex;flex-direction:column;align-items:center;width:9rem;margin:.5rem;position:relative}
.ring{width:7.8rem;height:7.8rem;border-radius:50%;padding:.22rem;border:.22rem solid var(--accent);transition:box-shadow .2s,border-color .2s;position:relative;background:#0d1525;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}.ring .ph{font-size:2.9rem}
.name{font-size:1.05rem;font-weight:700;color:var(--text);text-align:center;line-height:1.3;margin-top:.75rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.78rem;font-weight:800;padding:.08rem .7rem;border-radius:99rem;margin-top:.3rem;white-space:nowrap}.badge.ok{color:var(--ok);background:rgba(52,211,153,.15)}.badge.dl{background:var(--accent);color:#041320}

.bottom{display:flex;justify-content:center;align-items:center}
.net-pill{display:flex;align-items:center;background:rgba(15,23,42,.85);border:.08rem solid rgba(52,211,153,.5);border-radius:99rem;padding:.5rem 1.1rem;font-size:.95rem;font-weight:800;color:var(--ok);margin:0 .7rem;white-space:nowrap;flex-shrink:0}
.net-pill .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--ok);margin:0 0 0 .55rem}
.renew{display:flex;align-items:center;flex-shrink:0;margin:0 .7rem;background:rgba(15,23,42,.65);border:.08rem solid var(--line);border-radius:1.1rem;padding:.4rem .9rem}
.renew .txt{text-align:end;margin:0 0 0 .9rem}.renew .txt b{display:block;font-size:1.2rem;color:var(--cream);font-weight:900;white-space:nowrap}.renew .txt small{display:block;font-size:1.15rem;color:var(--accent);direction:ltr;font-weight:900;margin-top:3px;white-space:nowrap}
.qrbox{background:#fff;border-radius:.6rem;padding:.32rem;width:5.8rem;height:5.8rem;flex-shrink:0}.qrbox img{width:100%;height:100%}

#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid var(--accent);border-radius:99rem;padding:.6rem 2rem;font-size:1.1rem;font-weight:700;display:none;z-index:120}#toast.on{display:block}
</style>
</head>
<body class="kb">
<div id="bg"></div>

<section id="scrHome" class="screen on">
  <div class="top">
    <div class="lg" id="shopLogo">AZ</div>
    <div class="top-brand"><b id="shopName">AZ SAT CONNECT</b><small>الوكيل المعتمد · أحدث أجهزة الاستقبال</small></div>
    <div class="topleft">
      <div class="clock"><b id="clockTime">--:--</b><small id="clockDate">--</small></div>
    </div>
  </div>
  <div class="mid">
    <div class="welcome" id="welcomeMsg">مرحباً بكم في CONNECT TV</div>
    <div id="apps"></div>
  </div>
  <div class="bottom">
    <div class="net-pill"><span class="dot"></span><span>متصل بالإنترنت 🟢</span></div>
    <div class="renew">
      <div class="txt"><b>للتجديد والاشتراك</b><small>+216 26 117 917</small></div>
      <div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://wa.me/21626117917" alt=""></div>
    </div>
  </div>
</section>

<div id="toast"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var N = window.MyTV || null;
var SERVER = (window.MYTV_SERVER || 'https://azsatconnect.alwaysdata.net').replace(/\/+$/, '');

function layout(){
  var w = window.innerWidth, h = window.innerHeight;
  document.documentElement.style.fontSize = (Math.min(w/1280, h/720) * 16).toFixed(2) + 'px';
}
window.addEventListener('resize', layout);
layout();

function $(id){ return document.getElementById(id); }
function toast(msg){
  var el = $('toast'); el.textContent = msg; el.classList.add('on');
  setTimeout(function(){ el.classList.remove('on'); }, 3500);
}

var DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function updateClock(){
  var d = new Date();
  $('clockTime').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  $('clockDate').textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}
setInterval(updateClock, 1000); updateClock();

var info = {};
try { info = JSON.parse(N ? N.deviceInfo() : '{}'); } catch(e){}
var uid = info.uid || localStorage.getItem('mytv_uid');
if(!uid){
  uid = 'tv-' + Math.random().toString(36).substring(2, 10).toUpperCase();
  localStorage.setItem('mytv_uid', uid);
}

function loadData(){
  fetch(SERVER + '/api/device.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'config', uid: uid, model: 'Android TV' })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (data.shop) {
      $('shopName').textContent = data.shop.name || 'AZ SAT CONNECT';
      $('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم في CONNECT TV';
      if (data.shop.logo) $('shopLogo').innerHTML = '<img src="' + data.shop.logo + '" alt="">';
    }
    renderApps(data.apps || []);
  })
  .catch(function(){});
}

function renderApps(apps){
  var box = $('apps'); box.innerHTML = '';
  
  var setBtn = document.createElement('button');
  setBtn.className = 'app f';
  setBtn.innerHTML = '<div class="ring"><div class="ph">⚙️</div></div><div class="name">الإعدادات</div><div class="badge ok">مثبّت ✓</div>';
  setBtn.onclick = function(){ if(N && typeof N.openSystem === 'function') N.openSystem('settings'); };
  box.appendChild(setBtn);

  apps.forEach(function(a){
    var btn = document.createElement('button');
    btn.className = 'app f';
    var ic = a.icon ? '<img src="' + a.icon + '" alt="">' : '<div class="ph">📺</div>';
    btn.innerHTML = '<div class="ring">' + ic + '</div><div class="name">' + a.name + '</div><div class="badge dl">تشغيل</div>';
    btn.onclick = function(){
      if(N && a.package && !N.launch(a.package)){
        if(a.apk && typeof N.download === 'function'){
          toast('جاري تحميل ' + a.name + '...');
          N.download('a' + a.id, a.apk);
        }
      }
    };
    box.appendChild(btn);
  });

  setTimeout(function(){
    var first = box.querySelector('.f');
    if(first) first.focus();
  }, 100);
}

document.addEventListener('keydown', function(e){
  var map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', 37:'left', 39:'right', 38:'up', 40:'down' };
  var dir = map[e.key] || map[e.keyCode];
  if (dir) {
    e.preventDefault();
    var list = [].filter.call(document.querySelectorAll('.f'), function(el){ return el.getBoundingClientRect().width > 0; });
    var cur = document.activeElement;
    var idx = list.indexOf(cur);
    if (idx < 0 && list[0]) { list[0].focus(); return; }
    if (dir === 'right') idx = Math.min(idx + 1, list.length - 1);
    else if (dir === 'left') idx = Math.max(idx - 1, 0);
    else if (dir === 'down') idx = Math.min(idx + 4, list.length - 1);
    else if (dir === 'up') idx = Math.max(idx - 4, 0);
    if (list[idx]) list[idx].focus();
  } else if (e.keyCode === 23 || e.keyCode === 13 || e.key === 'Enter') {
    var ac = document.activeElement;
    if (ac && ac.click) { e.preventDefault(); ac.click(); }
  }
});

loadData();
})();
</script>
</body>
</html>
