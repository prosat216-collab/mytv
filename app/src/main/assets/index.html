<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #0a0c11; font-family: sans-serif; color: #fff; overflow: hidden; user-select: none; }

/* تنسيق متوافق مع كافة شاشات أندرويد تي في وأجهزة البوكس */
.screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0a0c11;
    text-align: center;
    padding-top: 50px;
    display: none;
}

.logo { font-size: 4.5rem; font-weight: 900; color: #ffb21e; margin-bottom: 20px; }
.logo span { color: #fff; }
.code-box {
    display: inline-block;
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: 15px;
    padding: 10px 40px;
    border-radius: 15px;
    background: #141721;
    border: 3px solid #ffb21e;
    color: #fff;
    margin: 20px auto;
}
.sub-title { font-size: 2rem; color: #f6e7c8; margin-bottom: 15px; }
.desc { font-size: 1.3rem; color: #a59f92; max-width: 600px; margin: 0 auto; line-height: 1.6; }

/* الشاشة الرئيسية للمحل */
.shop-name { font-size: 3.5rem; font-weight: bold; color: #ffb21e; margin-bottom: 10px; }
.welcome { font-size: 1.6rem; color: #f6e7c8; margin-bottom: 40px; }
.grid { width: 90%; margin: 0 auto; text-align: center; }

.app-card {
    display: inline-block;
    vertical-align: top;
    background: #161b22;
    border: 3px solid #333;
    border-radius: 15px;
    padding: 25px 15px;
    margin: 15px;
    width: 180px;
    cursor: pointer;
    outline: none;
    transition: transform 0.2s, border-color 0.2s;
    -webkit-transition: -webkit-transform 0.2s, border-color 0.2s;
}
.app-card:focus, .app-card:hover {
    border-color: #ffb21e;
    background: #221b10;
    transform: scale(1.1);
    -webkit-transform: scale(1.1);
}
.app-icon { font-size: 3.5rem; margin-bottom: 10px; }
.app-name { font-size: 1.3rem; font-weight: bold; color: #fff; }

/* نافذة الرسائل المنبثقة */
#msgModal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    z-index: 9999;
}
.msg-box {
    background: #161b22;
    border: 3px solid #ffb21e;
    padding: 35px;
    border-radius: 15px;
    max-width: 550px;
    margin: 100px auto 0 auto;
    text-align: center;
}
.msg-title { color: #ffb21e; font-size: 2rem; margin-bottom: 15px; font-weight: bold; }
.msg-body { font-size: 1.5rem; color: #fff; margin-bottom: 25px; line-height: 1.5; }
.msg-btn { 
    background: #ffb21e; 
    color: #000; 
    border: none; 
    padding: 12px 35px; 
    font-size: 1.4rem; 
    font-weight: bold; 
    border-radius: 8px; 
    cursor: pointer; 
    outline: none; 
}
.msg-btn:focus { 
    box-shadow: 0 0 15px #fff; 
    transform: scale(1.05); 
    -webkit-transform: scale(1.05); 
}
</style>
</head>
<body>

<!-- 1. شاشة الكود -->
<div id="scrPair" class="screen" style="display: block;">
  <div class="logo">My<span>TV</span></div>
  <div class="sub-title">اربط هذا الجهاز بمحلك</div>
  <div><span class="code-box" id="pairCode">7559E</span></div>
  <div class="desc">أعطِ هذا الكود لصاحب المحل لتفعيل الجهاز عن بعد من لوحة التحكم.</div>
</div>

<!-- 2. الشاشة الرئيسية -->
<div id="scrHome" class="screen">
  <div class="shop-name" id="shopName">محل إلكترو سات</div>
  <div class="welcome" id="welcomeMsg">مرحباً بكم</div>
  <div class="grid" id="appsContainer"></div>
</div>

<!-- 3. نافذة استقبال الرسائل -->
<div id="msgModal">
  <div class="msg-box">
    <div class="msg-title">✉️ رسالة من المحل</div>
    <div class="msg-body" id="msgText"></div>
    <button class="msg-btn" id="msgClose">موافق</button>
  </div>
</div>

<script>
(function () {
  var N = window.MyTV || null;
  var DATA_URL = "https://raw.githubusercontent.com/prosat216-collab/mytv/main/data.json";
  
  // كود الجهاز المفعل
  var myCode = "7559E";
  
  // متغير داخلي لحفظ الرسالة المقروءة فوراً في الجلسة
  var dismissedMsgId = "";

  function $(id) { return document.getElementById(id); }

  function showScreen(screenId) { 
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
        screens[i].style.display = 'none';
    }
    var target = document.getElementById(screenId);
    if (target) target.style.display = 'block';
  }

  function fetchConfig() {
    var url = DATA_URL + "?t=" + new Date().getTime();

    // جلب البيانات عبر نظام أندرويد لتفادي حظر الشبكة
    if (N && typeof N.fetchUrl === 'function') {
        N.fetchUrl(url);
    } else {
        fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) { handleData(data); })
        .catch(function() {});
    }
  }

  // استقبال البيانات من أندرويد
  window.onCloudData = function(ok, result) {
      if (ok) {
          try {
              var data = JSON.parse(result);
              handleData(data);
          } catch(e) {}
      }
  };

  // توافق مع الأسماء الأخرى للجسر
  window.__api = window.onCloudData;

  function handleData(data) {
    var isPaired = false;
    if (data && data.devices) {
        for (var key in data.devices) {
            var d = data.devices[key];
            if (d.active === true && (key === myCode || d.code === myCode)) {
                isPaired = true;
                break;
            }
        }
    }

    if (isPaired) {
        renderHome(data);
        checkMessages(data);
    } else {
        showScreen('scrPair');
    }
  }

  function renderHome(data) {
    if (data.shop) {
        $('shopName').textContent = data.shop.name || 'محل إلكترو سات';
        $('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم';
    }
    
    var grid = $('appsContainer');
    grid.innerHTML = '';

    var apps = data.apps || [];
    for (var i = 0; i < apps.length; i++) {
      (function(app) {
        var btn = document.createElement('button');
        btn.className = 'app-card';
        btn.innerHTML = '<div class="app-icon">📺</div><div class="app-name">' + app.name + '</div>';
        btn.onclick = function() { 
            if (N && app.package) N.launch(app.package); 
        };
        grid.appendChild(btn);
      })(apps[i]);
    }

    showScreen('scrHome');

    // توجيه تركيز الريموت كنترول إلى أول تطبيق إذا لم تكن هناك رسالة معروضة
    if ($('msgModal').style.display !== 'block') {
        var first = grid.querySelector('.app-card');
        if (first && document.activeElement !== first) first.focus();
    }
  }

  function checkMessages(data) {
    if (!data || !data.messages || data.messages.length === 0) {
        $('msgModal').style.display = 'none';
        return;
    }

    var lastMsg = data.messages[data.messages.length - 1];
    var msgKey = String(lastMsg.id || lastMsg.body || "");

    if (!msgKey) return;

    // 1. فحص هل تم إغلاقها في الجلسة الحالية
    if (dismissedMsgId === msgKey) return;

    // 2. فحص ذاكرة أندرويد الدائمة (SharedPreferences)
    var savedId = "";
    if (N && typeof N.prefGet === 'function') {
        savedId = N.prefGet("last_seen_msg");
    }

    // 3. فحص التخزين المحلي كخيار إضافي
    if (!savedId) {
        try { savedId = localStorage.getItem("last_seen_msg"); } catch(e) {}
    }

    // إذا كانت الرسالة قد شوهدت من قبل، لا تظهرها أبداً
    if (savedId === msgKey) {
        dismissedMsgId = msgKey;
        return;
    }

    // إظهار الرسالة وتوجيه الريموت لزر موافق
    $('msgText').textContent = lastMsg.body;
    $('msgModal').style.display = 'block';
    $('msgClose').focus();

    // عند ضغط الزبون على موافق بالريموت
    $('msgClose').onclick = function() {
        dismissedMsgId = msgKey;

        // حفظ في ذاكرة أندرويد الدائمة
        if (N && typeof N.prefSet === 'function') {
            N.prefSet("last_seen_msg", msgKey);
        }

        try { localStorage.setItem("last_seen_msg", msgKey); } catch(e) {}

        // إخفاء الرسالة فوراً
        $('msgModal').style.display = 'none';

        // نقل تركيز الريموت لأول تطبيق
        var first = $('appsContainer').querySelector('.app-card');
        if (first) first.focus();
    };
  }

  // فحص السحاب فوراً ثم كل 7 ثوانٍ للبحث عن جديد
  fetchConfig();
  setInterval(fetchConfig, 7000);
})();
</script>
</body>
</html>
