<script>
    setInterval(function() {
        fetch("https://raw.githubusercontent.com/prosat216-collab/mytv/main/data.json")
        .then(r => r.json())
        .then(data => {
            if(data.messages && data.messages.length > 0) {
                var latest = data.messages[data.messages.length - 1];
                if(localStorage.getItem("lastMsg") !== latest.id) {
                    alert(latest.body);
                    localStorage.setItem("lastMsg", latest.id);
                }
            }
        });
    }, 60000); // يفحص كل 60 ثانية
</script>
