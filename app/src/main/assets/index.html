<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
:root{
  --ink:#06080d; --panel:rgba(10,16,26,.95); --line:rgba(56,189,248,.4); --line2:#1e293b;
  --text:#f0f9ff; --cream:#e0f2fe; --muted:#94a3b8;
  --accent:#38bdf8; --accent2:#7dd3fc; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --grad:linear-gradient(135deg,#38bdf8,#0284c7);
  --bgc:#0c1524;
}
html{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:system-ui,sans-serif;color:var(--text);user-select:none}
img{display:block}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at center,var(--bgc) 0%,#030712 100%)}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
.accent-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:3rem;font-weight:900;letter-spacing:.1rem;line-height:1;direction:ltr}
.logo .white{color:#fff}
.ltr{direction:ltr;unicode-bidi:embed}

.f{outline:none;transition:transform .15s}
.kb .f:focus{box-shadow:0 0 0 .24rem var(--accent2),0 .6rem 2rem -.3rem var(--line)}
.kb .app.f:focus{box-shadow:none;transform:scale(1.1)}
.kb .app.f:focus .ring{border-color:var(--accent2);box-shadow:0 0 0 .28rem var(--line),0 .8rem 2.2rem -.3rem var(--accent)}
.kb .app.f:focus .name{color:var(--accent)}

#scrLoading,#scrPair,#scrLock{align-items:center;justify-content:center;text-align:center;padding:2rem}
#scrLoading .logo{font-size:4.5rem;margin-bottom:2rem}
.spin{width:3.5rem;height:3.5rem;border-radius:50%;border:.35rem solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#scrPair .logo{font-size:3.8rem;margin-bottom:1.4rem}
#scrPair h1,#scrLock h1{font-size:2.1rem;font-weight:800;margin-bottom:.8rem}
.code{font-family:monospace;font-weight:900;direction:ltr;font-size:5.2rem;letter-spacing:1.1rem;padding:.55rem 2.8rem;border-radius:1.4rem;background:rgba(10,16,26,.8);border:.15rem solid var(--accent);color:#fff;margin:1.2rem 0}
#scrPair p,#scrLock p{font-size:1.2rem;color:var(--cream);max-width:44rem;line-height:1.6;margin-bottom:1rem}
.lock-card{background:var(--panel);border:.12rem solid var(--line);border-radius:1.6rem;padding:2rem 2.6rem;max-width:44rem;width:92%;display:flex;flex-direction:column;align-items:center}

#scrHome{padding:1.4rem 3rem 1.2rem;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.lg{width:4.8rem;height:4.8rem;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.8rem;color:#041320;border:.16rem solid var(--accent);overflow:hidden}
.lg img{width:100%;height:100%;object-fit:cover}
.top-brand{flex:1;text-align:center;padding:0 1rem;min-width:0}
.top-brand b{display:block;font-size:2.6rem;font-weight:900;line-height:1.1;letter-spacing:.05rem;white-space:nowrap;text-shadow:0 .2rem 1rem rgba(0,0,0,.6)}
.top-brand small{display:block;font-size:.95rem;color:var(--muted);margin-top:.2rem}
.clock{text-align:start;flex-shrink:0}
.clock b{display:block;font-size:2.1rem;font-weight:700;direction:ltr;line-height:1.1;color:var(--accent)}
.clock small{font-size:.88rem;color:var(--muted)}
.topleft{display:flex;align-items:center;flex-shrink:0}

.wx{display:flex;align-items:center;background:rgba(15,23,42,.65);border:.08rem solid var(--line);border-radius:1.1rem;padding:.4rem 1rem;margin:0 1rem 0 0}
html[dir="ltr"] .wx{margin:0 0 0 1rem}
.wx.off{display:none}
.wx .t{font-size:2rem;font-weight:800;direction:ltr;margin:0 .6rem;line-height:1;color:var(--accent)}
.wx .d{font-size:.85rem;line-height:1.35;color:#cbd5e1}
.wx .d b{display:block;color:#fff;font-size:.95rem}

.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.welcome{font-size:1.45rem;font-weight:700;color:var(--cream);background:rgba(15,23,42,.7);border:.08rem solid var(--line);border-radius:99rem;padding:.4rem 2.2rem;text-align:center;margin-bottom:1.1rem}
#apps{display:flex;flex-wrap:wrap;justify-content:center;max-width:70rem;max-height:100%;overflow-y:auto;padding:.5rem}
.app{display:flex;flex-direction:column;align-items:center;width:9rem;margin:.5rem;position:relative}
.ring{width:7.8rem;height:7.8rem;border-radius:50%;padding:.28rem;border:.22rem solid var(--accent);transition:box-shadow .2s,border-color .2s;position:relative;background:#0d1525;display:flex;align-items:center;justify-content:center}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ring .ph{font-size:2.9rem}
.newdot{display:none;position:absolute;top:.2rem;left:.6rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#ef4444;border:.18rem solid #06080d}
.has-new .newdot{display:block}
.name{font-size:1.05rem;font-weight:700;color:var(--text);text-align:center;line-height:1.3;margin-top:.75rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.78rem;font-weight:800;padding:.08rem .7rem;border-radius:99rem;margin-top:.3rem;white-space:nowrap}
.badge.ok{color:var(--ok);background:rgba(52,211,153,.15)}
.badge.dl{background:var(--accent);color:#041320}
.badge.run{background:var(--warn);color:#000}

.bottom{display:flex;justify-content:center;align-items:center}
.net-pill{display:flex;align-items:center;background:rgba(15,23,42,.8);border:.08rem solid rgba(52,211,153,.5);border-radius:99rem;padding:.5rem 1.1rem;font-size:.95rem;font-weight:800;color:var(--ok);margin:0 .7rem;white-space:nowrap;flex-shrink:0}
.net-pill .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--ok);margin:0 0 0 .55rem;box-shadow:0 0 .6rem var(--ok)}
html[dir="ltr"] .net-pill .dot{margin:0 .55rem 0 0}
.net-pill.bad{border-color:rgba(248,113,113,.6);color:var(--bad)}
.net-pill.bad .dot{background:var(--bad);box-shadow:0 0 .6rem var(--bad)}

.pray{display:flex;align-items:stretch;background:rgba(15,23,42,.75);border:.08rem solid var(--line);border-radius:1.1rem;padding:.35rem;margin:0 .7rem}
.pray.off{display:none}
.pray .p{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.3rem .85rem;border-radius:.8rem;min-width:4.7rem}
.pray .p small{font-size:.82rem;color:var(--muted)}
.pray .p b{font-size:1.18rem;font-weight:800;direction:ltr;line-height:1.2}
.pray .p.next{background:var(--grad);color:#041320}
.pray .p.next small{color:#082f49;font-weight:800}
.pray .p em{font-style:normal;font-size:.7rem;font-weight:800;margin-top:.1rem}

.renew{display:flex;align-items:center;flex-shrink:0;margin:0 .7rem;background:rgba(15,23,42,.6);border:.08rem solid var(--line);border-radius:1.1rem;padding:.4rem .85rem}
.renew .txt{text-align:end;margin:0 0 0 .9rem}
html[dir="ltr"] .renew .txt{margin:0 .9rem 0 0}
.renew .txt b{display:block;font-size:1.2rem;color:var(--cream);font-weight:800;white-space:nowrap}
.renew .txt small{display:block;font-size:1.15rem;color:var(--accent);direction:ltr;unicode-bidi:embed;font-weight:900;margin-top:3px;white-space:nowrap}
.qrbox{background:#fff;border-radius:.6rem;padding:.32rem;width:5.8rem;height:5.8rem;flex-shrink:0}
.qrbox img{width:100%;height:100%}

.qbar{display:none;align-items:center;margin-top:.8rem;background:rgba(15,23,42,.92);border:.1rem solid var(--accent);border-radius:99rem;padding:.3rem .6rem .3rem 1.3rem}
.qbar.on{display:flex}
.qbar .qt{margin:0 .9rem;width:15rem}
.qbar .qt b{display:block;font-size:1rem;font-weight:800;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .qt small{display:block;font-size:.82rem;color:var(--muted)}
.qb{width:2.7rem;height:2.7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1e293b;margin:0 .2rem;font-size:1.15rem}
.qb.main{background:var(--grad);color:#041320;font-weight:bold}

#scrSettings{padding:1.8rem 3.4rem;overflow-y:auto;align-items:center}
#scrSettings h1{font-size:1.8rem;font-weight:800;max-width:64rem;width:100%;margin:0 auto 1.4rem;color:var(--accent)}
.set-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:1.6rem;align-items:start;max-width:64rem;width:100%;margin:0 auto}
.card{background:var(--panel);border:.08rem solid var(--line);border-radius:1.2rem;padding:1.4rem;display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:1rem;border-bottom:.06rem solid #1e293b;padding:.5rem 0}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:800}
.set-btn{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:1.05rem;font-weight:700;padding:.65rem 1.2rem;border-radius:.8rem;background:rgba(15,23,42,.7);border:.08rem solid var(--line2);margin-bottom:.7rem;text-align:start}
.set-btn:focus{border-color:var(--accent);background:#1e293b}
.set-btn em{font-style:normal;color:var(--accent);font-weight:800}

#scrQuran, #scrSurah{padding:1.8rem 3.4rem 1.2rem}
.sthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-shrink:0}
.sthead h1{font-size:1.9rem;font-weight:800;color:var(--blue)}
.stback{font-size:1rem;font-weight:700;color:var(--cream);border:.1rem solid var(--line);border-radius:99rem;padding:.45rem 1.5rem;background:rgba(15,23,42,.8)}
.qgrid{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -.4rem;padding:.3rem 0}
.qr1{width:33.333%;padding:.5rem}
.qr1 .c{height:7.5rem;border-radius:1rem;border:.12rem solid var(--line);background:#0d1525;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.5rem;transition:transform .15s}
.qr1:focus .c{border-color:var(--sky);background:#1e293b;transform:scale(1.04)}
.qr1 .c b{font-size:1.35rem;font-weight:800;color:var(--cream)}
.qr1 .c small{margin-top:.4rem;font-size:.85rem;color:var(--blue)}
.qs1{width:16.666%;padding:.35rem}
.qs1 .c{display:flex;align-items:center;height:3.6rem;border-radius:.8rem;border:.08rem solid var(--line2);background:#0d1525;padding:0 .7rem}
.qs1 .c i{font-style:normal;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--blue);color:var(--blue);font-size:.85rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qs1 .c b{font-size:1rem;font-weight:700;margin:0 .6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs1:focus .c{border-color:var(--sky);background:#1e293b;transform:scale(1.05)}

#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}
#modal.on{display:flex}
.m-box{background:#0f172a;border:.15rem solid var(--accent);border-radius:1.4rem;padding:2.2rem;max-width:36rem;width:90%;text-align:center}
.m-box h2{color:var(--accent);font-size:1.7rem;margin-bottom:1rem}
.m-box p{font-size:1.25rem;color:#fff;margin-bottom:1.6rem;line-height:1.6}
.btn{font-size:1.1rem;font-weight:800;padding:.6rem 2rem;border-radius:.8rem;background:var(--grad);color:#041320;cursor:pointer;margin:.3rem}
.btn.ghost{background:#1e293b;color:#fff;border:1px solid var(--line)}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid var(--accent);border-radius:99rem;padding:.6rem 2rem;font-size:1.1rem;font-weight:700;display:none;z-index:120}
#toast.on{display:block}
</style>
</head>

</section>

    if (dl[a.id]) return;
    if (stateOf(a) === 'ok') { if (!N || !N.launch(a.package)) toast(t('noOpenToast') + a.name); return; }
    if (!a.apk || a.apk.trim() === '') { if (N && N.launch(a.package)) return; toast(t('noApkToast')); return; }
    startInstall(a);
  }

  function startInstall(a) {
    if (!N) return;
    if (typeof N.canInstall === 'function' && !N.canInstall()) {
      pendingPerm = a;
      showModal(t('permTitle'), t('permText'), [{ label: t('openSetBtn'), run: function () { N.openInstallPermission(); } }, { label: t('cancelBtn'), ghost: true, run: function () { pendingPerm = null; } }]);
      return;
    }
    dl[a.id] = { phase: 'busy', pct: 0 }; updateBadges();
    N.download('a' + a.id, a.apk);
  }

  window.__dl = function (key, state, pct) {
    if (key === 'u') { if (state === 'error') toast(t('dlFail')); else if (state === 'progress') toast(pct + '%'); return; }
    var id = +String(key).replace('a', '');
    if (state === 'busy') { toast(t('dlBusy')); return; }
    if (state === 'error') { delete dl[id]; updateBadges(); toast(t('dlFail')); return; }
    if (!dl[id]) dl[id] = { phase: 'busy', pct: 0 };
    if (state === 'progress') dl[id].pct = pct;
    if (state === 'install') dl[id].phase = 'install';
    updateBadges();
  };

  window.onNativeResume = function () {
    Object.keys(dl).forEach(function (k) {
      var id = +k;
      if (dl[id] && dl[id].phase === 'install') {
        delete dl[id];
        var a = (cfg && cfg.apps || []).filter(function (x) { return x.id === id; })[0];
        if (a && stateOf(a) === 'ok') toast(a.name + ' - ' + t('dlDone'));
      }
    });
    if (pendingPerm && N && N.canInstall()) { var a = pendingPerm; pendingPerm = null; startInstall(a); }
    updateBadges();
  };

  var reciters = [
    { ar: 'مشاري راشد العفاسي', fr: 'Mishary Al-Afasy', en: 'Mishary Al-Afasy', server: 'https://server8.mp3quran.net/afs/' },
    { ar: 'عبد الباسط عبد الصمد', fr: 'Abdulbasit Abdussamad', en: 'Abdulbasit Abdussamad', server: 'https://server7.mp3quran.net/basit/' },
    { ar: 'سعد الغامدي', fr: 'Saad Al-Ghamdi', en: 'Saad Al-Ghamdi', server: 'https://server7.mp3quran.net/s_gmd/' },
    { ar: 'ماهر المعيقلي', fr: 'Maher Al-Muaiqly', en: 'Maher Al-Muaiqly', server: 'https://server12.mp3quran.net/maher/' },
    { ar: 'ياسر الدوسري', fr: 'Yasser Al-Dosari', en: 'Yasser Al-Dosari', server: 'https://server11.mp3quran.net/yasser/' },
    { ar: 'عبد الرحمن السديس', fr: 'Abdurrahman As-Sudais', en: 'Abdurrahman As-Sudais', server: 'https://server11.mp3quran.net/sds/' }
  ];
  var SURAHS = ['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];

  var qAudio = new Audio(), audioMode = '', qIdxR = 0, qIdxS = 0;
  function pad3(n) { return ('00' + n).slice(-3); }
  function rTitle(r) { return r[lang] || r.ar; }

  function openQuranMenu() {
    var box = $('qReciters'); box.innerHTML = '';
    reciters.forEach(function (r, idx) {
      var b = document.createElement('button'); b.className = 'qr1 f';
      b.innerHTML = '<div class="c"><b>' + rTitle(r) + '</b><small>' + t('qListInfo') + '</small></div>';
      b.onclick = function () { openSurahMenu(idx); };
      box.appendChild(b);

  }
  function openSurahMenu(rIdx) {
    qIdxR = rIdx; $('surahReciterName').textContent = '📖 ' + rTitle(reciters[rIdx]);
    var box = $('qSurahs'); box.innerHTML = '';
    SURAHS.forEach(function (name, i) {
      var b = document.createElement('button'); b.className = 'qs1 f';
      b.innerHTML = '<div class="c"><i>' + (i + 1) + '</i><b>' + name + '</b></div>';
      b.onclick = function () { playSurah(rIdx, i + 1); };
      box.appendChild(b);

    show('scrSurah');
  }
  function playSurah(rIdx, sNum) {
    audioMode = 'quran'; qIdxR = rIdx; qIdxS = sNum;
    qAudio.src = reciters[rIdx].server + pad3(sNum) + '.mp3';
    qAudio.play().catch(function () { toast(t('qNetToast')); });

    $('qbSub').textContent = rTitle(reciters[rIdx]);
    $('qbar').classList.add('on'); $('qbPlay').textContent = '⏸';
    show('scrHome');
  }
  qAudio.addEventListener('ended', function () {
    if (audioMode === 'quran' && qIdxS < 114) playSurah(qIdxR, qIdxS + 1);
    else if (audioMode === 'quran') window.audioStop();
  });

  window.qToggle = function () { if (qAudio.paused) { qAudio.play(); $('qbPlay').textContent = '⏸'; } else { qAudio.pause(); $('qbPlay').textContent = '▶'; } };
  window.qStop = function () { audioMode = ''; qAudio.pause(); qAudio.currentTime = 0; $('qbar').classList.remove('on'); };
  window.onNativePause = function () { if (!qAudio.paused) window.qToggle(); };

  function openStore() {
    var list = cfg && cfg.store || []; if (list.length) pset('store_seen', String(list[0].id));
    var box = $('storeList'); box.innerHTML = '';
    list.forEach(function (p) {
      var b = document.createElement('button'); b.className = 'st1 f';
      b.innerHTML = '<div class="im"><img src="' + (p.thumb || p.url) + '" alt=""></div>';
      b.onclick = function () { $('phImg').src = p.url; show('scrPhoto'); };

  window.runSpeedTest = function () {
    showModal(t('speedL'), t('speedTesting'), [{ label: t('cancelBtn'), ghost: true }]);
    var t0 = Date.now();
    fetch(SERVER + '/api/speed.php?r=' + t0, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var sec = Math.max(0.05, (Date.now() - t0) / 1000);
        var mbps = ((txt.length * 8) / sec / 1000000).toFixed(1);
        var rate = mbps >= 15 ? t('speedFast') : (mbps >= 5 ? t('speedMid') : t('speedSlow'));
        showModal(t('speedL'), t('speedRes') + '<br><b style="font-size:2.2rem;color:var(--accent)" dir="ltr">' + mbps + ' Mbps</b><br><br>' + rate, [{ label: t('okBtn')}]);
      })
      .catch(function () {
        var p0 = Date.now();
        postApi('/api/weather.php', { uid: info.uid, lat: 36.8, lon: 10.18 }, function (ok) {
          var ms = Date.now() - p0;
          showModal(t('speedL'), ok ? ('Ping: <b dir="ltr">' + ms + ' ms</b><br>' + (ms < 400 ? t('speedFast') : t('speedMid'))) : t('qNetToast'), [{ label: t('okBtn')}]);
        });
      });
  };

  window.openSettings = function () { updateToggles(); show('scrSettings'); };
  window.closeSettings = function () { show(cfg && cfg.paired && cfg.active ? 'scrHome' : (cfg && cfg.paired ? 'scrLock' : 'scrPair')); };
  window.backHome = function () { window.closeSettings(); };
  window.openSystemSetting = function (type) { if (N && typeof N.openSystem === 'function') N.openSystem(type); };

  window.appBack = function () {
    if ($('modal').classList.contains('on')) { $('modal').classList.remove('on'); focusFirst(); return true; }
    if (currentScreen === 'scrPhoto') { show('scrStore'); return true; }
    if (currentScreen === 'scrSurah') { show('scrQuran'); return true; }
    if (['scrQuran','scrStore','scrSettings'].indexOf(currentScreen) >= 0) { window.backHome(); return true; }
    return false;
  };

  document.addEventListener('keydown', function (e) {
    var map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', 37:'left', 39:'right', 38:'up', 40:'down' };
    var dir = map[e.key] || map[e.keyCode];
    if (dir) {
      e.preventDefault();
      var list = focusables(); if (!list.length) return;
      var cur = document.activeElement; if (list.indexOf(cur) < 0) { list[0].focus(); return; }
      var a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
      var best = null, bestScore = Infinity;
      list.forEach(function (el) {
        if (el === cur) return;
        var b = el.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
        var dx = bx - ax, dy = by - ay, main, cross;
        if (dir === 'left') { main = -dx; cross = Math.abs(dy); }
        else if (dir === 'right') { main = dx; cross = Math.abs(dy); }
        else if (dir === 'up') { main = -dy; cross = Math.abs(dx); }
        else { main = dy; cross = Math.abs(dx); }
        if (main <= 2) return;
        var score = main + cross * 2.2;
        if (score < bestScore) { bestScore = score; best = el; }
      });
      if (best) { best.focus(); if (best.scrollIntoView) best.scrollIntoView({ block:'nearest', inline:'nearest' }); }
    } else if (e.keyCode === 23 || e.keyCode === 13 || e.key === 'Enter') {
      var ac = document.activeElement;
      if (ac && ac.classList && ac.classList.contains('f')) { e.preventDefault(); ac.click(); }
    } else if (e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack') {
      if (window.appBack()) e.preventDefault();
    }
  });
} else if (e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack') {
      if (window.appBack()) e.preventDefault();
    }
  });

  applyLang();
  loadWeather();
  window.refresh(false);
  show('scrHome'); // <-- أضف هذا السطر هنا ليفتح فوراً
})();
