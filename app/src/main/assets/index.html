<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="content">جاري التحميل...</div>
    <script>
        var DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQk1L7jzKOmZL4tJVX5gmMUDBcrRL_WolRDVXVDo0l-TN6H1xgSbX8JXGE_PjsseafiBjlJoNMlT7To/pub?output=csv";
        var myCode = "A3CD8"; 

        fetch(DATA_URL + "?v=" + new Date().getTime())
        .then(r => r.text())
        .then(csv => {
            if(csv.includes(myCode) && csv.includes("true")) {
                document.getElementById('content').innerHTML = "<h1>مرحباً بك في محل إلكترو سات</h1>";
            } else {
                document.getElementById('content').innerHTML = "<h1>الكود: " + myCode + "</h1><p>يرجى التفعيل من لوحة التحكم</p>";
            }
        }).catch(e => {
            document.getElementById('content').innerHTML = "خطأ في الاتصال";
        });
    </script>
</body>
</html>
