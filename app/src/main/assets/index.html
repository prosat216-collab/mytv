<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0c11; font-family: sans-serif; color: #fff; overflow: hidden; user-select: none; }

.screen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0c11;
    text-align: center;
    padding-top: 50px;
    display: none;
}

.logo { font-size: 4.5rem; font-weight: 900; color: #ffb21e; margin-bottom: 20px; }
.logo span { color: #fff; }
.code-box {
    display: inline-block;
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: 15px;
    padding: 10px 40px;
    border-radius: 15px;
    background: #141721;
    border: 3px solid #ffb21e;
    color: #fff;
    margin: 20px auto;
}
.sub-title { font-size: 2rem; color: #f6e7c8; margin-bottom: 15px; }
.desc { font-size: 1.3rem; color: #a59f92; max-width: 600px; margin: 0 auto; line-height: 1.6; }

#debugBar {
    position: fixed;
    bottom: 10px; left: 10px; right: 10px;
    background: rgba(22, 27, 34, 0.95);
    border: 1px solid #30363d;
    padding: 12px;
    font-size: 1.1rem;
    color: #ffb21e;
    font-family: monospace;
    border-radius: 8px;
    direction: ltr;
    text-align: center;
}

.shop-name { font-size: 3.5rem; font-weight: bold; color: #ffb21e; margin-bottom: 10px; }
.welcome { font-size: 1.6rem; color: #f6e7c8; margin-bottom: 40px; }
.grid { width: 90%; margin: 0 auto; text-align: center; }

.app-card {
    display: inline-block;
    vertical-align: top;
    background: #161b22;
    border: 3px solid #333;
    border-radius: 15px;
    padding: 25px 15px;
    margin: 15px;
    width: 180px;
    cursor: pointer;
    outline: none;
    transition: transform 0.2s, border-color 0.2s;
}
.app-card:focus, .app-card:hover {
    border-color: #ffb21e;
    background: #221b10;
    transform: scale(1.1);
}
.app-icon { font-size: 3.5rem; margin-bottom: 10px; }
.app-name { font-size: 1.3rem; font-weight: bold; color: #fff; }

#msgModal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: none; z-index: 9999;
}
.msg-box {
    background: #161b22; border: 3px solid #ffb21e; padding: 35px;
    border-radius: 15px; max-width: 550px; margin: 100px auto 0 auto; text-align: center;
}
.msg-title { color: #ffb21e; font-size: 2rem; margin-bottom: 15px; font-weight: bold; }
.msg-body { font-size: 1.5rem; color: #fff; margin-bottom: 25px; line-height: 1.5; }
.msg-btn { background: #ffb21e; color: #000; border: none; padding: 12px 35px; font-size: 1.4rem; font-weight: bold; border-radius: 8px; cursor: pointer; outline: none; }
</style>
</head>
<body>

<div id="scrPair" class="screen" style="display: block;">
  <div class="logo">My<span>TV</span></div>
  <div class="sub-title">اربط هذا الجهاز بمحلك</div>
  <div><span class="code-box" id="pairCode">7559E</span></div>
  <div class="desc">أعطِ هذا الكود لصاحب المحل لتفعيل الجهاز عن بعد من لوحة التحكم.</div>
</div>

<div id="scrHome" class="screen">
  <div class="shop-name" id="shopName">محل إلكترو سات</div>
  <div class="welcome" id="welcomeMsg">مرحباً بكم</div>
  <div class="grid" id="appsContainer"></div>
</div>

<div id="msgModal">
  <div class="msg-box">
    <div class="msg-title">✉️ رسالة من المحل</div>
    <div class="msg-body" id="msgText"></div>
    <button class="msg-btn" id="msgClose">موافق</button>
  </div>
</div>

<div id="debugBar">جاري الاتصال بالسحاب عبر نظام الأندرويد...</div>

<script>
(function () {
  var N = window.MyTV || null;
  var DATA_URL = "https://raw.githubusercontent.com/prosat216-collab/mytv/main/data.json";
  var myCode = "7559E";

  function setDebug(msg, color) {
      var d = document.getElementById('debugBar');
      if (d) {
          d.innerText = msg;
          d.style.color = color || '#ffb21e';
      }
  }

  function showScreen(screenId) { 
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].style.display = 'none';
    var target = document.getElementById(screenId);
    if (target) target.style.display = 'block';
  }

  function fetchConfig() {
    var url = DATA_URL + "?t=" + new Date().getTime();
    setDebug("جاري جلب البيانات من السحاب...", "#ffb21e");

    // نستخدم اتصال نظام الأندرويد المباشر لتجاوز حظر المتصفح
    if (N && typeof N.fetchUrl === 'function') {
        N.fetchUrl(url);
    } else {
        fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) { handleData(data); })
        .catch(function(err) { setDebug("Fetch Error: " + err.message, "#f85149"); });
    }
  }

  // هذه الدالة يستدعيها نظام الأندرويد بعد جلب البيانات بنجاح
  window.onCloudData = function(ok, result) {
      if (ok) {
          try {
              var data = JSON.parse(result);
              handleData(data);
          } catch(e) {
              setDebug("خطأ في قراءة ملف JSON", "#f85149");
          }
      } else {
          setDebug("خطأ اتصال الأندرويد: " + result, "#f85149");
      }
  };

  function handleData(data) {
    var isPaired = false;
    if (data && data.devices) {
        for (var key in data.devices) {
            var d = data.devices[key];
            if (d.active === true && (key === myCode || d.code === myCode)) {
                isPaired = true;
                break;
            }
        }
    }

    if (isPaired) {
        document.getElementById('debugBar').style.display = 'none';
        renderHome(data);
        checkMessages(data);
    } else {
        setDebug("الجهاز غير مفعل في data.json بعد. جاري الانتظار...", "#f85149");
        showScreen('scrPair');
    }
  }

  function renderHome(data) {
    if (data.shop) {
        document.getElementById('shopName').textContent = data.shop.name || 'محل إلكترو سات';
        document.getElementById('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم';
    }
    
    var grid = document.getElementById('appsContainer');
    grid.innerHTML = '';

    var apps = data.apps || [];
    for (var i = 0; i < apps.length; i++) {
      (function(app) {
        var btn = document.createElement('button');
        btn.className = 'app-card';
        btn.innerHTML = '<div class="app-icon">📺</div><div class="app-name">' + app.name + '</div>';
        btn.onclick = function() { 
            if (N && app.package) N.launch(app.package); 
        };
        grid.appendChild(btn);
      })(apps[i]);
    }

    showScreen('scrHome');
    setTimeout(function() {
      var first = grid.querySelector('.app-card');
      if (first) first.focus();
    }, 200);
  }

  function checkMessages(data) {
    if (data.messages && data.messages.length > 0) {
      var lastMsg = data.messages[data.messages.length - 1];
      var seenId = localStorage.getItem("last_seen_msg_id");
      
      if (seenId !== String(lastMsg.id)) {
         document.getElementById('msgText').textContent = lastMsg.body;
         document.getElementById('msgModal').style.display = 'block';
         document.getElementById('msgClose').focus();
         document.getElementById('msgClose').onclick = function() {
             localStorage.setItem("last_seen_msg_id", String(lastMsg.id));
             document.getElementById('msgModal').style.display = 'none';
             var first = document.getElementById('appsContainer').querySelector('.app-card');
             if (first) first.focus();
         };
      }
    }
  }

  fetchConfig();
  setInterval(fetchConfig, 7000);
})();
</script>
</body>
</html>
