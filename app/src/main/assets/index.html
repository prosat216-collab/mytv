<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MyTV</title>
<style>
:root{ --ink:#0a0c11; --panel:rgba(16,16,20,.95); --line:rgba(225,180,95,.45); --text:#f6efe0; --cream:#f6e7c8; --amber:#ffb21e; --grad:linear-gradient(135deg,#ffb21e,#ff5a36); }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:sans-serif;color:var(--text);user-select:none}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at center, #1f1b13 0%, #0a0c11 100%)}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex}
.gold{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:5rem;font-weight:900;letter-spacing:2px;margin-bottom:1.5rem}
.logo .tv{color:var(--text)}
.code{font-weight:900;font-size:5rem;letter-spacing:1rem;padding:0.6rem 2.5rem;border-radius:1.5rem;background:rgba(10,10,12,.8);border:3px solid var(--amber);margin:1.5rem 0;color:#fff}
h1{font-size:2.2rem;margin-bottom:0.8rem}
p{font-size:1.4rem;color:var(--cream);max-width:40rem;text-align:center;line-height:1.6}
.shop-title{font-size:3.5rem;font-weight:bold;margin-bottom:0.5rem;color:var(--amber);text-shadow:0 4px 15px rgba(255,178,30,0.4)}
.welcome-text{font-size:1.6rem;color:var(--cream);margin-bottom:2.5rem}
.apps-grid{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;max-width:90%}
.app-card{background:var(--panel);border:3px solid var(--line);border-radius:15px;padding:25px;display:flex;flex-direction:column;align-items:center;width:180px;cursor:pointer;outline:none;transition:transform 0.2s, border-color 0.2s;}
.app-card:focus,.app-card:hover{border-color:var(--amber);transform:scale(1.15);background:#221b10;box-shadow:0 10px 25px rgba(255,178,30,0.4)}
.app-name{margin-top:15px;font-size:1.3rem;font-weight:bold;color:#fff}
#msgModal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:999}
.msg-box{background:var(--panel);border:2px solid var(--amber);padding:35px;border-radius:15px;max-width:550px;text-align:center}
.msg-title{color:var(--amber);font-size:2rem;margin-bottom:15px;font-weight:bold}
.msg-body{font-size:1.5rem;color:#fff;margin-bottom:25px;line-height:1.5}
.msg-btn{background:var(--amber);color:#000;border:none;padding:12px 35px;font-size:1.4rem;font-weight:bold;border-radius:8px;cursor:pointer;outline:none}
.msg-btn:focus{box-shadow:0 0 15px #fff;transform:scale(1.05)}
</style>
</head>
<body>
<div id="bg"></div>

<!-- 1. شاشة الكود -->
<section id="scrPair" class="screen on">
  <div class="logo"><span class="gold">My</span><span class="tv">TV</span></div>
  <h1>اربط هذا الجهاز بمحلك</h1>
  <div class="code" id="pairCode">7559E</div>
  <p>أعطِ هذا الكود لصاحب المحل لتفعيل الجهاز عن بعد من لوحة التحكم.</p>
</section>

<!-- 2. الشاشة الرئيسية بعد التفعيل -->
<section id="scrHome" class="screen">
  <div class="shop-title" id="shopName">محل إلكترو سات</div>
  <div class="welcome-text" id="welcomeMsg">مرحباً بكم</div>
  <div class="apps-grid" id="appsContainer"></div>
</section>

<!-- 3. نافذة الرسائل -->
<div id="msgModal">
  <div class="msg-box">
    <div class="msg-title">✉️ رسالة من المحل</div>
    <div class="msg-body" id="msgText"></div>
    <button class="msg-btn" id="msgClose">موافق</button>
  </div>
</div>

<script>
(function () {
  var N = window.MyTV || null;
  // الرابط الفوري المباشر عبر API بدون أي كاش أو تأخير
  var API_URL = "https://api.github.com/repos/prosat216-collab/mytv/contents/data.json";

  var myCode = "7559E";

  function $(id) { return document.getElementById(id); }
  function show(id) { 
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); }); 
    $(id).classList.add('on'); 
  }

  function decodeUnicode(str) {
    try {
      return decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));
    } catch(e) {
      return "{}";
    }
  }

  function fetchConfig() {
    fetch(API_URL, {
      headers: { "Accept": "application/vnd.github.v3+json" }
    })
    .then(function(res){ return res.json(); })
    .then(function(file){
      var rawJson = decodeUnicode(file.content);
      var data = JSON.parse(rawJson);

      var isPaired = false;
      if (data && data.devices) {
        // فحص الكود مباشرة أو أي جهاز مفعل
        for (var k in data.devices) {
          if (data.devices[k].active === true && (k === myCode || data.devices[k].code === myCode)) {
            isPaired = true;
            break;
          }
        }
      }

      if (isPaired) {
        renderHome(data);
        checkMessages(data);
      } else {
        $('pairCode').textContent = myCode;
        show('scrPair');
      }
    })
    .catch(function(e){
      // في حال وجود مشكلة اتصال
      $('pairCode').textContent = myCode;
    });
  }

  function renderHome(data) {
    if (data.shop) {
        $('shopName').textContent = data.shop.name || 'محل إلكترو سات';
        $('welcomeMsg').textContent = data.shop.welcome || 'مرحباً بكم';
    }
    
    var grid = $('appsContainer');
    grid.innerHTML = '';

    (data.apps || []).forEach(function(app){
      var btn = document.createElement('button');
      btn.className = 'app-card';
      btn.innerHTML = '<div style="font-size:3.5rem">📺</div><div class="app-name">' + app.name + '</div>';
      btn.onclick = function() { 
          if (N && app.package) N.launch(app.package); 
      };
      grid.appendChild(btn);
    });

    show('scrHome');
    
    if ($('msgModal').style.display !== 'flex') {
        var first = grid.querySelector('.app-card');
        if (first && document.activeElement !== first) first.focus();
    }
  }

  function checkMessages(data) {
    if (data.messages && data.messages.length > 0) {
      var lastMsg = data.messages[data.messages.length - 1];
      var seenId = localStorage.getItem("last_seen_msg_id");
      
      if (seenId !== String(lastMsg.id)) {
         $('msgText').textContent = lastMsg.body;
         $('msgModal').style.display = 'flex';
         $('msgClose').focus();
         $('msgClose').onclick = function() {
             localStorage.setItem("last_seen_msg_id", String(lastMsg.id));
             $('msgModal').style.display = 'none';
             var first = $('appsContainer').querySelector('.app-card');
             if (first) first.focus();
         };
      }
    }
  }

  // فحص مباشر وفوري كل 5 ثوانٍ
  fetchConfig();
  setInterval(fetchConfig, 5000);
})();
</script>
</body>
</html>
