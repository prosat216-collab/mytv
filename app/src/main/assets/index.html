<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CONNECT TV</title>
<style>
:root{--ink:#06080d;--panel:rgba(10,16,26,.95);--line:rgba(56,189,248,.38);--line2:#1e293b;--text:#f0f9ff;--cream:#e0f2fe;--muted:#94a3b8;--accent:#38bdf8;--accent2:#7dd3fc;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--live:#ef4444;--grad:linear-gradient(135deg,#38bdf8,#0284c7);--bgc:#0c1524}
html{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,sans-serif;color:var(--text);user-select:none}
img{display:block}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at center,var(--bgc) 0%,#030712 100%)}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
.accent-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:3rem;font-weight:900;letter-spacing:.1rem;line-height:1;direction:ltr}
.logo .white{color:#fff}
.ltr{direction:ltr;unicode-bidi:embed}
.f{outline:none;transition:transform .15s}
.kb .f:focus{box-shadow:0 0 0 .24rem var(--accent2),0 .6rem 2rem -.3rem var(--line)}
.kb .app.f:focus{box-shadow:none;transform:scale(1.1)}
.kb .app.f:focus .ring{border-color:var(--accent2);box-shadow:0 0 0 .28rem var(--line),0 .8rem 2.2rem -.3rem var(--accent)}
.kb .app.f:focus .name{color:var(--accent)}
#scrLoading,#scrPair,#scrLock{align-items:center;justify-content:center;text-align:center;padding:2rem}
#scrLoading .logo{font-size:4.5rem;margin-bottom:2rem}
.spin{width:3.5rem;height:3.5rem;border-radius:50%;border:.35rem solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#scrPair .logo{font-size:3.8rem;margin-bottom:1.4rem}
#scrPair h1,#scrLock h1{font-size:2.1rem;font-weight:800;margin-bottom:.8rem}
.code{font-family:monospace;font-weight:900;direction:ltr;font-size:5.2rem;letter-spacing:1.1rem;padding:.55rem 2.8rem;border-radius:1.4rem;background:rgba(10,16,26,.8);border:.15rem solid var(--accent);color:#fff;margin:1.2rem 0}
#scrPair p,#scrLock p{font-size:1.2rem;color:var(--cream);max-width:44rem;line-height:1.6;margin-bottom:1rem}
.lock-card{background:var(--panel);border:.12rem solid var(--line);border-radius:1.6rem;padding:2rem 2.6rem;max-width:44rem;width:92%;display:flex;flex-direction:column;align-items:center}
#scrHome{padding:1.4rem 3rem 1.2rem;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.lg{width:4.8rem;height:4.8rem;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.8rem;color:#041320;border:.16rem solid var(--accent);overflow:hidden}
.lg img{width:100%;height:100%;object-fit:cover}
.top-brand{flex:1;text-align:center;padding:0 1rem;min-width:0}
.top-brand b{display:block;font-size:2.55rem;font-weight:900;line-height:1.1;letter-spacing:.05rem;white-space:nowrap;text-shadow:0 .2rem 1rem rgba(0,0,0,.6)}
.top-brand small{display:block;font-size:.95rem;color:var(--muted);margin-top:.2rem}
.clock{text-align:start;flex-shrink:0}
.clock b{display:block;font-size:2.1rem;font-weight:700;direction:ltr;line-height:1.1;color:var(--accent)}
.clock small{font-size:.88rem;color:var(--muted)}
.topleft{display:flex;align-items:center;flex-shrink:0}
.wx{display:flex;align-items:center;background:rgba(15,23,42,.65);border:.08rem solid var(--line);border-radius:1.1rem;padding:.4rem 1rem;margin:0 1rem 0 0}
html[dir="ltr"] .wx{margin:0 0 0 1rem}
.wx.off{display:none}
.wx .t{font-size:2rem;font-weight:800;direction:ltr;margin:0 .6rem;line-height:1;color:var(--accent)}
.wx .d{font-size:.85rem;line-height:1.35;color:#cbd5e1}
.wx .d b{display:block;color:#fff;font-size:.95rem}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.welcome{font-size:1.45rem;font-weight:700;color:var(--cream);background:rgba(15,23,42,.7);border:.08rem solid var(--line);border-radius:99rem;padding:.4rem 2.2rem;text-align:center;margin-bottom:1.1rem}
#apps{display:flex;flex-wrap:wrap;justify-content:center;max-width:72rem;max-height:100%;overflow-y:auto;padding:.5rem}
.app{display:flex;flex-direction:column;align-items:center;width:9rem;margin:.5rem;position:relative}
.ring{width:7.8rem;height:7.8rem;border-radius:50%;padding:.28rem;border:.22rem solid var(--accent);transition:box-shadow .2s,border-color .2s;position:relative;background:#0d1525;display:flex;align-items:center;justify-content:center}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ring .ph{font-size:2.9rem}
.newdot{display:none;position:absolute;top:.2rem;left:.6rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#ef4444;border:.18rem solid #06080d}
.has-new .newdot{display:block}
.lockdot{position:absolute;top:.15rem;right:.55rem;background:#0f172a;border:1px solid var(--accent);border-radius:99rem;font-size:.85rem;padding:.05rem .3rem}
.name{font-size:1.05rem;font-weight:700;color:var(--text);text-align:center;line-height:1.3;margin-top:.75rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.78rem;font-weight:800;padding:.08rem .7rem;border-radius:99rem;margin-top:.3rem;white-space:nowrap}
.badge.ok{color:var(--ok);background:rgba(52,211,153,.15)}
.badge.dl{background:var(--accent);color:#041320}
.badge.run{background:var(--warn);color:#000}
.bottom{display:flex;justify-content:center;align-items:center}
.net-pill{display:flex;align-items:center;background:rgba(15,23,42,.85);border:.08rem solid rgba(52,211,153,.5);border-radius:99rem;padding:.5rem 1.1rem;font-size:.95rem;font-weight:800;color:var(--ok);margin:0 .6rem;white-space:nowrap;flex-shrink:0}
.net-pill .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--ok);margin:0 0 0 .55rem;box-shadow:0 0 .6rem var(--ok)}
html[dir="ltr"] .net-pill .dot{margin:0 .55rem 0 0}
.net-pill.bad{border-color:rgba(248,113,113,.6);color:var(--bad)}
.net-pill.bad .dot{background:var(--bad);box-shadow:0 0 .6rem var(--bad)}
.pray{display:flex;align-items:stretch;background:rgba(15,23,42,.8);border:.08rem solid var(--line);border-radius:1.1rem;padding:.35rem;margin:0 .6rem}
.pray.off{display:none}
.pray .p{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.32rem .9rem;border-radius:.8rem;min-width:5rem}
.narrow .pray .p{min-width:4.3rem;padding:.28rem .6rem}
.pray .p small{font-size:.82rem;color:var(--muted)}
.pray .p b{font-size:1.18rem;font-weight:800;direction:ltr;line-height:1.2}
.pray .p.next{background:var(--grad);color:#041320}
.pray .p.next small{color:#082f49;font-weight:800}
.pray .p em{font-style:normal;font-size:.72rem;font-weight:900;margin-top:.12rem;white-space:nowrap;color:#041320}
.renew{display:flex;align-items:center;flex-shrink:0;margin:0 .6rem;background:rgba(15,23,42,.65);border:.08rem solid var(--line);border-radius:1.1rem;padding:.4rem .9rem}
.renew .txt{text-align:end;margin:0 0 0 .9rem}
html[dir="ltr"] .renew .txt{margin:0 .9rem 0 0}
.renew .txt b{display:block;font-size:1.2rem;color:var(--cream);font-weight:900;white-space:nowrap}
.renew .txt small{display:block;font-size:1.15rem;color:var(--accent);direction:ltr;unicode-bidi:embed;font-weight:900;margin-top:3px;white-space:nowrap}
.qrbox{background:#fff;border-radius:.6rem;padding:.32rem;width:5.8rem;height:5.8rem;flex-shrink:0}
.qrbox img{width:100%;height:100%}
.qbar{display:none;align-items:center;margin-top:.8rem;background:rgba(15,23,42,.92);border:.1rem solid var(--accent);border-radius:99rem;padding:.3rem .6rem .3rem 1.3rem}
.qbar.on{display:flex}
.qbar .qt{margin:0 .9rem;width:15rem}
.qbar .qt b{display:block;font-size:1rem;font-weight:800;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .qt small{display:block;font-size:.82rem;color:var(--muted)}
.qb{width:2.7rem;height:2.7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1e293b;margin:0 .2rem;font-size:1.15rem}
.qb.main{background:var(--grad);color:#041320;font-weight:bold}
.subscr{padding:1.4rem 3rem 1rem}
.sthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;flex-shrink:0;gap:.8rem}
.sthead h1{font-size:1.8rem;font-weight:800;color:var(--accent)}
.stback{font-size:1rem;font-weight:700;color:var(--cream);border:.1rem solid var(--line);border-radius:99rem;padding:.4rem 1.4rem;background:rgba(15,23,42,.8)}
.qgrid{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -.4rem;padding:.3rem 0}
.qr1{width:33.333%;padding:.45rem}
.qr1 .c{height:6.6rem;border-radius:1rem;border:.12rem solid var(--line);background:#0d1525;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.5rem}
.qr1:focus .c{border-color:var(--accent2);background:#1e293b;transform:scale(1.04)}
.qr1 .c b{font-size:1.2rem;font-weight:800;color:var(--cream)}
.qr1 .c small{margin-top:.3rem;font-size:.8rem;color:var(--accent)}
.qs1{width:16.666%;padding:.3rem}
.qs1 .c{display:flex;align-items:center;height:3.4rem;border-radius:.75rem;border:.08rem solid var(--line2);background:#0d1525;padding:0 .65rem}
.qs1 .c i{font-style:normal;width:1.9rem;height:1.9rem;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qs1 .c b{font-size:.98rem;font-weight:700;margin:0 .55rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs1:focus .c{border-color:var(--accent2);background:#1e293b;transform:scale(1.05)}
/* Xtream Layout */
.xc-wrap{flex:1;display:flex;gap:1rem;min-height:0}
.xc-cats{width:18rem;overflow-y:auto;background:var(--panel);border:.08rem solid var(--line);border-radius:1rem;padding:.5rem}
.xc-cat{display:block;width:100%;text-align:start;padding:.65rem .9rem;border-radius:.65rem;font-weight:700;font-size:.95rem;margin-bottom:.3rem;color:var(--cream)}
.xc-cat.on{background:var(--grad);color:#041320}
.xc-cat:focus{box-shadow:inset 0 0 0 .15rem var(--accent2)}
.xc-streams{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -.35rem}
.xc-ch{width:25%;padding:.35rem}
.xc-ch .c{height:6.5rem;background:#0d1525;border:.08rem solid var(--line2);border-radius:.9rem;padding:.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.xc-ch .c img{width:2.6rem;height:2.6rem;object-fit:contain;margin-bottom:.4rem}
.xc-ch .c b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.xc-ch:focus .c{border-color:var(--accent);background:#1e293b;transform:scale(1.04)}
/* Matches Flashscore */
.days-bar{display:flex;background:#0d1525;border:.1rem solid var(--line2);border-radius:.8rem;padding:.28rem;gap:.35rem}
.day-btn{padding:.38rem 1rem;border-radius:.55rem;font-size:.95rem;font-weight:800;color:var(--muted)}
.day-btn.active{background:var(--grad);color:#041320}
.live-filter{display:flex;align-items:center;gap:.45rem;padding:.38rem 1rem;border-radius:.8rem;background:#1e293b;border:.1rem solid #334155;color:#fff;font-weight:800;font-size:.92rem}
.live-filter.active{background:var(--live);border-color:#b91c1c}
.live-dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--live)}
.m-container{flex:1;overflow-y:auto;padding-right:.3rem}
.comp-card{background:var(--panel);border:.08rem solid var(--line2);border-radius:1rem;margin-bottom:.9rem;overflow:hidden}
.comp-card.fav{border-color:var(--line)}
.comp-header{display:flex;justify-content:space-between;align-items:center;background:#0d1525;padding:.7rem 1.1rem;border-bottom:.06rem solid var(--line2)}
.comp-title{font-size:1.1rem;font-weight:900}
.comp-count{background:#1e293b;color:var(--muted);font-size:.8rem;font-weight:800;padding:.15rem .6rem;border-radius:99rem}
.comp-count.has-live{background:var(--live);color:#fff}
.match-row{display:flex;align-items:center;padding:.7rem 1.1rem;border-bottom:.06rem solid rgba(30,41,59,.6);width:100%;text-align:inherit}
.match-row:focus{background:#172236;box-shadow:inset 0 0 0 .15rem var(--accent)}
.m-status{width:5.2rem;font-size:.9rem;font-weight:800;text-align:center;flex-shrink:0;color:var(--muted)}
.m-status.is-live{color:var(--live)}
.m-teams{flex:1;display:flex;flex-direction:column;gap:.35rem;padding:0 1rem}
.team-item{display:flex;align-items:center;gap:.6rem;font-size:1.05rem;font-weight:700}
.team-logo{width:1.5rem;height:1.5rem;object-fit:contain;flex-shrink:0}
.m-scores{display:flex;flex-direction:column;gap:.35rem;font-size:1.15rem;font-weight:900;font-family:monospace;width:2.4rem;text-align:center;color:var(--accent)}
.m-scores.is-live{color:var(--live)}
.st1{width:25%;padding:.5rem}
.st1 .im{position:relative;padding-top:70%;border-radius:.9rem;overflow:hidden;border:.14rem solid var(--line);background:#0d1525}
.st1 .im img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.st1:focus .im{border-color:var(--accent2);transform:scale(1.05)}
#scrPhoto{background:#000}
#phImg{width:100%;height:100%;object-fit:contain}
.ph-bar{position:fixed;bottom:1.5rem;left:2rem;right:2rem;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.ph-qr{pointer-events:auto;background:rgba(10,16,26,.92);border:.12rem solid var(--accent);border-radius:1rem;padding:.8rem 1.2rem;display:flex;align-items:center;gap:1rem}
#scrSettings{padding:1.6rem 3.2rem;overflow-y:auto;align-items:center}
#scrSettings h1{font-size:1.75rem;font-weight:800;max-width:66rem;width:100%;margin:0 auto .9rem;color:var(--accent)}
.set-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:1.3rem;align-items:start;max-width:66rem;width:100%;margin:0 auto}
.card{background:var(--panel);border:.08rem solid var(--line);border-radius:1.1rem;padding:1.1rem;display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;border-bottom:.06rem solid #1e293b;padding:.38rem 0}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:800}
.set-btn{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:.95rem;font-weight:700;padding:.46rem .95rem;border-radius:.7rem;background:rgba(15,23,42,.75);border:.08rem solid var(--line2);margin-bottom:.42rem;text-align:start}
.set-btn:focus{border-color:var(--accent);background:#1e293b}
.set-btn em{font-style:normal;color:var(--accent);font-weight:800}
.tgl{padding:.08rem .65rem;border-radius:99rem;font-size:.8rem;font-weight:900;background:#334155;color:#cbd5e1}
.tgl.on{background:var(--ok);color:#041320}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}
#modal.on{display:flex}
.m-box{background:#0f172a;border:.15rem solid var(--accent);border-radius:1.4rem;padding:1.8rem;max-width:40rem;width:92%;text-align:center;max-height:90vh;overflow-y:auto}
.m-box h2{color:var(--accent);font-size:1.6rem;margin-bottom:.8rem}
.m-box p{font-size:1.15rem;color:#fff;margin-bottom:1.2rem;line-height:1.5}
.m-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
.btn{font-size:1rem;font-weight:800;padding:.55rem 1.4rem;border-radius:.75rem;background:var(--grad);color:#041320;cursor:pointer}
.btn.ghost{background:#1e293b;color:#fff;border:1px solid var(--line)}
.pin-dots{font-size:2.4rem;letter-spacing:.8rem;color:var(--accent);margin:.6rem 0 1rem;font-family:monospace}
.pin-pad{display:grid;grid-template-columns:repeat(3,4.2rem);gap:.5rem;justify-content:center;margin-bottom:1rem;direction:ltr}
.pin-key{background:#1e293b;border:1px solid var(--line);border-radius:.7rem;padding:.75rem;font-size:1.3rem;font-weight:800;color:#fff}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid var(--accent);border-radius:99rem;padding:.6rem 2rem;font-size:1.1rem;font-weight:700;display:none;z-index:120}
#toast.on{display:block}
</style>
</head>
<body class="kb">
<div id="bg"></div>
<section id="scrLoading" class="screen on"><div class="logo"><span class="accent-txt">CONNECT</span> <span class="white">TV</span></div><div class="spin"></div></section>
<section id="scrPair" class="screen"><div class="logo"><span class="accent-txt">CONNECT</span> <span class="white">TV</span></div><h1 data-t="pairTitle"></h1><div class="code" id="pairCode">-----</div><p data-t="pairText"></p><button class="btn f" onclick="openSettings()" data-t="settings"></button></section>
<section id="scrLock" class="screen"><div class="lock-card"><div class="logo" style="font-size:2.6rem;margin-bottom:1rem"><span class="accent-txt">CONNECT</span> <span class="white">TV</span></div><h1 id="lockTitle"></h1><p id="lockText"></p><div class="qrbox" style="width:7.5rem;height:7.5rem;margin:.5rem auto"><img id="lockQrImg" src="" alt=""></div><b id="lockPhone" class="ltr" style="color:var(--accent);font-size:1.3rem;margin:.5rem 0 1.2rem">+216 26 117 917</b><div class="m-btns"><button class="btn f" onclick="refresh(true)" data-t="retryBtn"></button><button class="btn ghost f" onclick="openSettings()" data-t="settings"></button></div></div></section>

<section id="scrHome" class="screen">
  <div class="top">
    <div class="lg" id="shopLogo">CT</div>
    <div class="top-brand"><b id="shopName">CONNECT TV</b><small data-t="shopSub"></small></div>
    <div class="topleft">
      <div class="clock"><b id="clockTime">--:--</b><small id="clockDate">--</small></div>
      <div class="wx" id="wxBox"><div style="font-size:2rem">☀️</div><div class="t" id="wxTemp">22°</div><div class="d"><b id="wxCity">تونس</b><span style="font-size:.78rem;color:#94a3b8" id="wxDesc">صحو</span></div></div>
    </div>
  </div>
  <div class="mid">
    <div class="welcome" id="welcomeMsg">مرحباً بكم في CONNECT TV</div>
    <div id="apps"></div>
    <div class="qbar" id="qbar"><div style="font-size:1.6rem" id="qbIcon">📖</div><div class="qt"><b id="qbTitle"></b><small id="qbSub"></small></div><button class="qb main f" id="qbPlay" onclick="audioToggle()">⏸</button><button class="qb f" onclick="audioStop()">⏹</button></div>
  </div>
  <div class="bottom">
    <div class="net-pill" id="netPill"><span class="dot"></span><span id="netTxt"></span></div>
    <div class="pray" id="prayBox"></div>
    <div class="renew"><div class="txt"><b data-t="renewTitle"></b><small id="waPhone">+216 26 117 917</small></div><div class="qrbox"><img id="waQrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://wa.me/21626117917" alt=""></div></div>
  </div>
</section>

<section id="scrXtream" class="screen subscr">
  <div class="sthead">
    <h1>📺 <span data-t="xtTitle"></span></h1>
    <div style="display:flex;gap:.5rem">
      <button class="stback f" id="xtTabLive" onclick="switchXtMode('live')" data-t="xtLive"></button>
      <button class="stback f" id="xtTabVod" onclick="switchXtMode('vod')" data-t="xtVod"></button>
      <button class="stback f" onclick="backHome()" data-t="backL"></button>
    </div>
  </div>
  <div class="xc-wrap"><div class="xc-cats" id="xcCats"></div><div class="xc-streams" id="xcStreams"></div></div>
</section>

<section id="scrMatches" class="screen subscr">
  <div class="sthead"><h1>⚽ <span data-t="matchesTitle"></span></h1><div class="days-bar" id="daysBar"></div><button class="live-filter f" id="btnLiveFilter" onclick="toggleLiveFilter()"><span class="live-dot"></span> <span id="liveFilterTxt"></span></button><button class="stback f" onclick="backHome()" data-t="backL"></button></div>

function calcPrayers(lat,lon,date){var rad=Math.PI/180,deg=180/Math.PI,y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();if(m<=2){y-=1;m+=12;}var A=Math.floor(y/100),B=2-A+Math.floor(A/4),jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5,n=jd-2451545.0,g=(357.529+0.98560028*n)%360,q=(280.459+0.98564736*n)%360,L=(q+1.915*Math.sin(g*rad)+0.020*Math.sin(2*g*rad))%360,e=23.439-0.00000036*n,RA=Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))*deg/15,dec=Math.asin(Math.sin(e*rad)*Math.sin(L*rad))*deg,eqt=q/15-((RA+24)%24);if(eqt>12)eqt-=24;if(eqt<-12)eqt+=24;var dhuhr=12+1-lon/15-eqt;function ha(ang){var c=(Math.sin(ang*rad)-Math.sin(lat*rad)*Math.sin(dec*rad))/(Math.cos(lat*rad)*Math.cos(dec*rad));return Math.acos(Math.max(-1,Math.min(1,c)))*deg/15;}var asrAng=Math.atan(1/(1+Math.tan(Math.abs(lat-dec)*rad)))*deg;return{fajr:dhuhr-ha(-18),dhuhr:dhuhr,asr:dhuhr+ha(asrAng),maghrib:dhuhr+ha(-0.833),isha:dhuhr+ha(-17.5)};}
function fmtHr(hr){var m=Math.round(hr*60);return('0'+Math.floor(m/60)%24).slice(-2)+':'+('0'+(m%60)).slice(-2);}
function fmtRemain(mins){if(mins<=1)return t('prayNow');var h=Math.floor(mins/60),m=mins%60;return t('prayIn',{t:h>0?(h+'س '+m+'د'):(m+'د')});}
function renderPrayers(){var box=$('prayBox');if(!box||!featOn('pray'))return;var c=CITIES[cityIdx],now=new Date(),pt=calcPrayers(c[2],c[3],now),curMin=now.getHours()*60+now.getMinutes(),keys=['fajr','dhuhr','asr','maghrib','isha'],nextKey='fajr',nextDiff=0;for(var i=0;i<keys.length;i++){var pm=Math.round(pt[keys[i]]*60);if(pm>curMin){nextKey=keys[i];nextDiff=pm-curMin;break;}if(i===4)nextDiff=Math.round(pt.fajr*60)+1440-curMin;}var h='';keys.forEach(function(k){var isN=(k===nextKey);h+='<div class="p'+(isN?' next':'')+'"><small>'+t('p_'+k)+'</small><b>'+fmtHr(pt[k])+'</b>'+(isN?'<em>'+fmtRemain(nextDiff)+'</em>':'')+'</div>';});box.innerHTML=h;}

function getPin(){return pget('pin')||'0000';}
function askPin(title,onOk){
  var val='';
  function drawPin(){
    var dots='';for(var i=0;i<4;i++)dots+=(i<val.length?'●':'○');
    var pad='';for(var k=1;k<=9;k++)pad+='<button class="pin-key f" data-k="'+k+'">'+k+'</button>';
    pad+='<button class="pin-key f" data-k="clr">⌫</button><button class="pin-key f" data-k="0">0</button><button class="pin-key f" data-k="esc">✕</button>';
    $('modalBox').innerHTML='<h2>'+title+'</h2><div class="pin-dots">'+dots+'</div><div class="pin-pad">'+pad+'</div>';
    $('modal').classList.add('on');
    [].forEach.call($('modalBox').querySelectorAll('.pin-key'),function(btn){
      btn.onclick=function(){
        var k=btn.getAttribute('data-k');
        if(k==='esc'){$('modal').classList.remove('on');focusFirst();return;}
        if(k==='clr'){val=val.slice(0,-1);drawPin();return;}
        val+=k;
        if(val.length>=4){$('modal').classList.remove('on');onOk(val);setTimeout(focusFirst,40);}else{drawPin();}
      };
    });
    setTimeout(focusFirst,30);
  }
  drawPin();
}

function openSurahMenu(rIdx){qIdxR=rIdx;$('surahReciterName').textContent='📖 '+(reciters[rIdx][lang]||reciters[rIdx].ar);var box=$('qSurahs');box.innerHTML='';SURAHS.forEach(function(name,i){var b=document.createElement('button');b.className='qs1 f';b.innerHTML='<div class="c"><i>'+(i+1)+'</i><b>'+name+'</b></div>';b.onclick=function(){playSurah(rIdx,i+1);};box.appendChild(b);});show('scrSurah');}
function playSurah(rIdx,sNum){audioMode='quran';qIdxR=rIdx;qIdxS=sNum;qAudio.src=reciters[rIdx].server+pad3(sNum)+'.mp3';qAudio.play().catch(function(){toast(t('qNetToast'));});$('qbIcon').textContent='📖';$('qbTitle').textContent=t('surahWord')+SURAHS[sNum-1];$('qbSub').textContent=reciters[rIdx][lang]||reciters[rIdx].ar;$('qbar').classList.add('on');$('qbPlay').textContent='⏸';show('scrHome');}
qAudio.addEventListener('ended',function(){if(audioMode==='quran'&&qIdxS<114)playSurah(qIdxR,qIdxS+1);else if(audioMode==='quran')window.audioStop();});
function openRadio(){var box=$('radioList');box.innerHTML='<div style="margin:auto;font-size:1.3rem">'+t('st_wait')+'</div>';show('scrRadio');postApi('/api/radio.php',{},function(res){var list=(res&&res.stations)||[];box.innerHTML='';list.forEach(function(st){var b=document.createElement('button');b.className='qr1 f';b.innerHTML='<div class="c"><b>📻 '+st.name+'</b><small>'+t('radioLive')+'</small></div>';b.onclick=function(){audioMode='radio';qAudio.src=st.url;qAudio.play().catch(function(){toast(t('qNetToast'));});$('qbIcon').textContent='📻';$('qbTitle').textContent=st.name;$('qbSub').textContent=t('radioLive');$('qbar').classList.add('on');$('qbPlay').textContent='⏸';show('scrHome');};box.appendChild(b);});setTimeout(focusFirst,40);});}
window.audioToggle=function(){if(qAudio.paused){qAudio.play();$('qbPlay').textContent='⏸';}else{qAudio.pause();$('qbPlay').textContent='▶';}};
window.audioStop=function(){audioMode='';qAudio.pause();qAudio.currentTime=0;$('qbar').classList.remove('on');};
window.onNativePause=function(){if(!qAudio.paused)window.audioToggle();};

// --- المباريات والمتجر والسرعة ---
var curMatchDateOffset=0,matchesLiveFilter=false,lastMatchesData=null;
function formatMatchYmd(offset){var d=new Date();d.setDate(d.getDate()+offset);return ''+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);}
function renderDaysBar(){var bar=$('daysBar');if(!bar)return;bar.innerHTML='';var offsets=[-1,0,1],labels=[t('yesterdayTxt'),t('todayTxt'),t('tomorrowTxt')];offsets.forEach(function(off,idx){var btn=document.createElement('button');btn.className='day-btn f'+(off===curMatchDateOffset?' active':'');btn.textContent=labels[idx];btn.onclick=function(){curMatchDateOffset=off;renderDaysBar();loadMatches();};bar.appendChild(btn);});}
window.toggleLiveFilter=function(){matchesLiveFilter=!matchesLiveFilter;var btn=$('btnLiveFilter');if(btn){btn.classList.toggle('active',matchesLiveFilter);$('liveFilterTxt').textContent=matchesLiveFilter?t('allTxt'):t('liveOnlyTxt');}if(lastMatchesData)renderMatchesDom(lastMatchesData);};
window.loadMatches=function(){$('matchesContainer').innerHTML='<div style="margin:2rem auto;font-size:1.3rem;text-align:center">'+t('st_wait')+'</div>';postApi('/api/matches.php',{date:formatMatchYmd(curMatchDateOffset)},function(res){lastMatchesData=res;renderMatchesDom(res);});};
function renderMatchesDom(res){var box=$('matchesContainer');box.innerHTML='';var cats=(res&&res.categories)||[],renderedCount=0;cats.forEach(function(c){var ml=c.matches||[];if(matchesLiveFilter)ml=ml.filter(function(m){return m.is_live;});if(!ml.length)return;renderedCount++;var card=document.createElement('div');card.className='comp-card'+(c.is_fav?' fav':'');var title=lang==='fr'?c.title_fr:c.title_ar,cb=c.live_in_league>0?'<span class="comp-count has-live">'+c.live_in_league+' '+t('mLive')+'</span>':'<span class="comp-count">'+ml.length+'</span>',h='<div class="comp-header"><span class="comp-title">'+title+'</span>'+cb+'</div>';ml.forEach(function(m){var sc=m.is_live?'is-live':(m.state==='post'?'is-post':''),st=m.is_live?(m.detail||t('mLive')):(m.state==='post'?t('mFT'):m.time),hl=m.home_logo?'<img class="team-logo" src="'+m.home_logo+'" alt="">':'',al=m.away_logo?'<img class="team-logo" src="'+m.away_logo+'" alt="">':'';h+='<button class="match-row f"><div class="m-status '+sc+'">'+st+'</div><div class="m-teams"><div class="team-item">'+hl+'<span>'+m.home_name+'</span></div><div class="team-item">'+al+'<span>'+m.away_name+'</span></div></div><div class="m-scores '+sc+'"><span>'+(m.home_score!==''?m.home_score:'-')+'</span><span>'+(m.away_score!==''?m.away_score:'-')+'</span></div></button>';});card.innerHTML=h;box.appendChild(card);});if(!renderedCount)box.innerHTML='<div style="margin:3rem auto;font-size:1.3rem;text-align:center;color:var(--muted)">'+t('noMatches')+'</div>';setTimeout(focusFirst,40);}
function openMatches(){renderDaysBar();$('liveFilterTxt').textContent=t('liveOnlyTxt');show('scrMatches');window.loadMatches();}

function openStore(){var list=cfg&&cfg.store||[];if(list.length)pset('store_seen',String(list[0].id));var box=$('storeList');box.innerHTML='';list.forEach(function(p){var b=document.createElement('button');b.className='st1 f';b.innerHTML='<div class="im"><img src="'+(p.thumb||p.url)+'" alt=""></div>';b.onclick=function(){$('phImg').src=p.url;show('scrPhoto');};box.appendChild(b);});appsSig='';show('scrStore');}

window.runSpeedTest=function(){showModal(t('speedL'),t('speedTesting'),[{label:t('cancelBtn'),ghost:true}]);var t0=Date.now();fetch(SERVER+'/api/speed.php?r='+t0,{cache:'no-store'}).then(function(r){return r.text();}).then(function(txt){var sec=Math.max(0.05,(Date.now()-t0)/1000),mbps=((txt.length*8)/sec/1000000).toFixed(1),c=mbps>=15?'#34d399':(mbps>=5?'#fbbf24':'#f87171'),rm=mbps>=15?t('speedFast'):(mbps>=5?t('speedMid'):t('speedSlow'));showModal(t('speedL'),t('speedRes')+'<br><b style="font-size:2.4rem;color:'+c+';margin:.5rem 0;display:block" dir="ltr">'+mbps+' Mbps</b><span style="font-size:1.15rem;font-weight:bold;color:'+c+'">'+rm+'</span>',[{label:t('okBtn')}]);}).catch(function(){var p0=Date.now();postApi('/api/weather.php',{uid:info.uid,lat:36.8,lon:10.18},function(ok){var ms=Date.now()-p0,pc=ms<200?'#34d399':(ms<500?'#fbbf24':'#f87171'),pr=ms<200?t('speedFast'):(ms<500?t('speedMid'):t('speedSlow'));showModal(t('speedL'),ok?('Ping: <b style="font-size:2rem;color:'+pc+'" dir="ltr">'+ms+' ms</b><br><span style="color:'+pc+';font-weight:bold">'+pr+'</span>'):t('qNetToast'),[{label:t('okBtn')}]);});});};

window.openSettings=function(){updateToggles();show('scrSettings');};
window.closeSettings=function(){show(cfg&&cfg.paired&&cfg.active?'scrHome':(cfg&&cfg.paired?'scrLock':'scrPair'));};
window.backHome=function(){window.closeSettings();};
window.openSystemSetting=function(type){if(N&&typeof N.openSystem==='function')N.openSystem(type);};
window.appBack=function(){if($('modal').classList.contains('on')){$('modal').classList.remove('on');focusFirst();return true;}if(currentScreen==='scrPhoto'){show('scrStore');return true;}if(currentScreen==='scrSurah'){show('scrQuran');return true;}if(['scrQuran','scrRadio','scrMatches','scrStore','scrSettings','scrXtream'].indexOf(currentScreen)>=0){window.backHome();return true;}return false;};

document.addEventListener('keydown',function(e){var map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',37:'left',39:'right',38:'up',40:'down'},dir=map[e.key]||map[e.keyCode];if(dir){e.preventDefault();var list=focusables();if(!list.length)return;var cur=document.activeElement;if(list.indexOf(cur)<0){list[0].focus();return;}var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bestScore=Infinity;list.forEach(function(el){if(el===cur)return;var b=el.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay,main,cross;if(dir==='left'){main=-dx;cross=Math.abs(dy);}else if(dir==='right'){main=dx;cross=Math.abs(dy);}else if(dir==='up'){main=-dy;cross=Math.abs(dx);}else{main=dy;cross=Math.abs(dx);}if(main<=2)return;var score=main+cross*2.2;if(score<bestScore){bestScore=score;best=el;}});if(best){best.focus();if(best.scrollIntoView)best.scrollIntoView({block:'nearest',inline:'nearest'});}}else if(e.keyCode===23||e.keyCode===13||e.key==='Enter'){var ac=document.activeElement;if(ac&&ac.classList&&ac.classList.contains('f')){e.preventDefault();ac.click();}}else if(e.key==='Escape'||e.key==='GoBack'||e.key==='BrowserBack'){if(window.appBack())e.preventDefault();}});

applyLang();loadWeather();if(cfg)render();window.refresh(false);
})();
