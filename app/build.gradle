plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mytv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.mytv.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
